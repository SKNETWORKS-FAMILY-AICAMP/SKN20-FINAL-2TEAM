<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀번호 재설정 - FTOGuard</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="styles-pages.css">
    <link rel="stylesheet" href="styles-auth.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <a href="index.html" class="logo">
                    <div class="logo-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <rect x="3" y="3" width="18" height="18" rx="2" stroke="white" stroke-width="2"/>
                            <path d="M9 12L11 14L15 10" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <span class="logo-text">FTOGuard</span>
                </a>
                
                <nav class="nav">
                    <a href="index.html" class="nav-link">홈</a>
                    <a href="how-it-works.html" class="nav-link">작동 원리</a>
                    <a href="about.html" class="nav-link">소개</a>
                </nav>
                
                <div class="header-actions">
                    <button class="btn-secondary" onclick="window.location.href='login.html'">로그인</button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main auth-main">
        <div class="auth-container">
            <div class="auth-card">
                <div class="auth-header">
                    <h1 class="auth-title">비밀번호 재설정</h1>
                    <p class="auth-subtitle">가입 시 등록한 이메일 주소를 입력하세요</p>
                </div>

                <form id="forgotPasswordForm" class="auth-form">
                    <div class="form-group">
                        <label for="resetEmail" class="form-label">이메일</label>
                        <input 
                            type="email" 
                            id="resetEmail" 
                            class="form-input" 
                            placeholder="example@email.com"
                            required
                            autocomplete="email"
                        />
                        <p class="form-hint">
                            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <circle cx="8" cy="8" r="7" stroke="currentColor" stroke-width="1.5"/>
                                <path d="M8 8V12M8 5V5.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                            </svg>
                            비밀번호 재설정 링크를 이메일로 보내드립니다.
                        </p>
                    </div>

                    <button type="submit" class="btn-primary-large auth-submit">
                        재설정 링크 보내기
                    </button>
                </form>

                <div class="auth-footer">
                    <p><a href="login.html" class="auth-link">← 로그인으로 돌아가기</a></p>
                </div>
            </div>

            <!-- Success State (Hidden by default) -->
            <div class="auth-card" id="resetSuccessCard" style="display: none;">
                <div class="auth-header">
                    <div class="success-icon">
                        <svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="32" cy="32" r="30" stroke="#10B981" stroke-width="4"/>
                            <path d="M20 32L28 40L44 24" stroke="#10B981" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <h1 class="auth-title">이메일을 확인하세요</h1>
                    <p class="auth-subtitle">
                        비밀번호 재설정 링크를 <strong id="sentEmailAddress"></strong>로 보내드렸습니다.
                    </p>
                </div>

                <div class="auth-info-box">
                    <p>이메일이 도착하지 않았나요?</p>
                    <ul>
                        <li>스팸 메일함을 확인해주세요</li>
                        <li>이메일 주소가 정확한지 확인해주세요</li>
                        <li>몇 분 후에 다시 시도해주세요</li>
                    </ul>
                </div>

                <button class="btn-primary-large auth-submit" onclick="location.reload()">
                    다시 시도하기
                </button>

                <div class="auth-footer">
                    <p><a href="login.html" class="auth-link">← 로그인으로 돌아가기</a></p>
                </div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
    <script src="auth.js"></script>
</body>
</html>
