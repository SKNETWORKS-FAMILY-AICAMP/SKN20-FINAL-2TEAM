<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀번호 재설정 - FTOGuard</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css');
        
        * {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        :root {
            --primary: #FF6B35;
        }
        
        .text-primary { color: var(--primary); }
        .bg-primary { background-color: var(--primary); }
        .hover\:bg-primary\/90:hover { background-color: rgba(255, 107, 53, 0.9); }
        .focus\:ring-primary:focus { 
            --tw-ring-color: rgba(255, 107, 53, 0.5);
        }
    </style>
</head>

<body class="bg-neutral-50">
    
    <!-- 공통 헤더 -->
    <div id="app-header"></div>

    <!-- Main Content -->
    <main class="min-h-screen flex items-center justify-center p-6 pt-32 pb-20">
        <div class="w-full max-w-md">
            <div class="bg-white p-8 md:p-10 rounded-3xl border border-neutral-200 shadow-lg">
                <div class="text-center mb-8">
                    <h1 class="text-2xl md:text-3xl font-bold text-black mb-2">비밀번호 재설정</h1>
                    <p class="text-sm text-neutral-600">가입 시 등록한 이메일 주소를 입력하세요</p>
                </div>

                <form id="forgotPasswordForm" class="space-y-5">
                    <div>
                        <label for="resetEmail" class="block text-xs font-semibold text-neutral-700 uppercase mb-2">이메일</label>
                        <input 
                            type="email" 
                            id="resetEmail" 
                            class="w-full px-4 py-3 bg-neutral-50 border border-neutral-200 rounded-xl focus:ring-2 focus:ring-primary focus:border-primary outline-none transition text-sm" 
                            placeholder="example@email.com" 
                            required 
                            autocomplete="email" 
                        />
                        <p class="text-xs text-neutral-500 mt-2 flex items-center gap-1">
                            <i class="fas fa-info-circle"></i>
                            <span>비밀번호 재설정 링크를 이메일로 보내드립니다.</span>
                        </p>
                    </div>

                    <button 
                        type="submit" 
                        class="w-full py-3.5 bg-primary text-white rounded-xl font-semibold hover:bg-primary/90 transition-all shadow-md hover:shadow-lg text-sm"
                    >
                        재설정 링크 보내기
                    </button>
                </form>

                <div class="mt-6 text-center">
                    <p class="text-sm text-neutral-600">
                        <a href="login.html" class="text-primary font-semibold hover:underline">← 로그인으로 돌아가기</a>
                    </p>
                </div>
            </div>

            <!-- Success State -->
            <div class="bg-white p-8 md:p-10 rounded-3xl border border-neutral-200 shadow-lg mt-6" id="resetSuccessCard" style="display: none;">
                <div class="text-center mb-8">
                    <div class="w-16 h-16 bg-green-50 text-green-500 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
                        <i class="fas fa-check-circle"></i>
                    </div>
                    <h1 class="text-xl md:text-2xl font-bold text-black mb-2">이메일을 확인하세요</h1>
                    <p class="text-sm text-neutral-600">
                        비밀번호 재설정 링크를 <strong id="sentEmailAddress" class="text-black"></strong>로 보내드렸습니다.
                    </p>
                </div>

                <div class="bg-blue-50 border border-blue-200 rounded-2xl p-6 text-sm text-neutral-700 space-y-2">
                    <p class="font-semibold text-black mb-3">이메일이 도착하지 않았나요?</p>
                    <ul class="space-y-1 ml-4 list-disc">
                        <li>스팸 메일함을 확인해주세요</li>
                        <li>이메일 주소가 정확한지 확인해주세요</li>
                        <li>몇 분 후에 다시 시도해주세요</li>
                    </ul>
                </div>

                <button 
                    class="w-full py-3.5 bg-primary text-white rounded-xl font-semibold hover:bg-primary/90 transition-all shadow-md hover:shadow-lg mt-6 text-sm" 
                    onclick="location.reload()"
                >
                    다시 시도하기
                </button>

                <div class="mt-6 text-center">
                    <p class="text-sm text-neutral-600">
                        <a href="login.html" class="text-primary font-semibold hover:underline">← 로그인으로 돌아가기</a>
                    </p>
                </div>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="toast.js"></script>
    <script src="script.js"></script>
    <script src="auth.js"></script>
    <script src="email-api-integration.js"></script>
    
    <script>
        // Load header.html
        fetch('header.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('app-header').innerHTML = data;
                
                const scripts = document.getElementById('app-header').querySelectorAll('script');
                scripts.forEach(script => {
                    const newScript = document.createElement('script');
                    if (script.src) {
                        newScript.src = script.src;
                    } else {
                        newScript.textContent = script.textContent;
                    }
                    document.body.appendChild(newScript);
                });
            })
            .catch(error => console.error('Error loading header:', error));
    </script>
</body>
</html>
