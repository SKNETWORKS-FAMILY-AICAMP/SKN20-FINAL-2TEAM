<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀번호 재설정 - FTOGuard</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body class="bg-slate-50">
    
    <!-- ✅ 공통 헤더 -->
    <div id="app-header"></div>

    <!-- Main Content -->
    <main class="min-h-screen flex items-center justify-center p-6 pt-32">
        <div class="w-full max-w-md">
            <div class="bg-white p-10 rounded-[2rem] border border-slate-100 shadow-2xl shadow-slate-200/50">
                <div class="text-center mb-8">
                    <h1 class="text-3xl font-extrabold text-slate-800 mb-2">비밀번호 재설정</h1>
                    <p class="text-slate-500 text-sm">가입 시 등록한 이메일 주소를 입력하세요</p>
                </div>

                <form id="forgotPasswordForm" class="space-y-6">
                    <div>
                        <label for="resetEmail" class="block text-xs font-bold text-slate-400 uppercase mb-2 ml-1">이메일</label>
                        <input type="email" id="resetEmail" class="w-full px-5 py-4 bg-slate-50 border border-slate-100 rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none transition" placeholder="example@email.com" required autocomplete="email" />
                        <p class="text-xs text-slate-400 mt-2 ml-1 flex items-center space-x-1">
                            <i class="fas fa-info-circle"></i>
                            <span>비밀번호 재설정 링크를 이메일로 보내드립니다.</span>
                        </p>
                    </div>

                    <button type="submit" class="w-full py-4 bg-slate-900 text-white rounded-2xl font-bold hover:bg-blue-600 transition-all shadow-lg">
                        재설정 링크 보내기
                    </button>
                </form>

                <div class="mt-8 pt-8 border-t border-slate-50 text-center">
                    <p class="text-sm text-slate-500">
                        <a href="login.html" class="text-blue-600 font-bold hover:underline">← 로그인으로 돌아가기</a>
                    </p>
                </div>
            </div>

            <!-- Success State -->
            <div class="bg-white p-10 rounded-[2rem] border border-slate-100 shadow-2xl shadow-slate-200/50 mt-6" id="resetSuccessCard" style="display: none;">
                <div class="text-center mb-8">
                    <div class="w-16 h-16 bg-green-50 text-green-500 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
                        <i class="fas fa-check-circle"></i>
                    </div>
                    <h1 class="text-2xl font-extrabold text-slate-800 mb-2">이메일을 확인하세요</h1>
                    <p class="text-slate-500 text-sm">
                        비밀번호 재설정 링크를 <strong id="sentEmailAddress"></strong>로 보내드렸습니다.
                    </p>
                </div>

                <div class="bg-blue-50 border border-blue-100 rounded-2xl p-6 text-sm text-slate-600 space-y-2">
                    <p class="font-bold text-slate-800 mb-3">이메일이 도착하지 않았나요?</p>
                    <ul class="space-y-1 ml-4 list-disc">
                        <li>스팸 메일함을 확인해주세요</li>
                        <li>이메일 주소가 정확한지 확인해주세요</li>
                        <li>몇 분 후에 다시 시도해주세요</li>
                    </ul>
                </div>

                <button class="w-full py-4 bg-slate-900 text-white rounded-2xl font-bold hover:bg-blue-600 transition-all shadow-lg mt-6" onclick="location.reload()">
                    다시 시도하기
                </button>

                <div class="mt-6 text-center">
                    <p class="text-sm text-slate-500">
                        <a href="login.html" class="text-blue-600 font-bold hover:underline">← 로그인으로 돌아가기</a>
                    </p>
                </div>
            </div>
        </div>
    </main>

    <!-- 기존 스크립트 -->
    <script src="toast.js"></script>
    <script src="script.js"></script>
    <script src="auth.js"></script>

    <!-- ✅ 새로 추가 -->
    <script src="email-api-integration.js"></script>

</body>
</html>
