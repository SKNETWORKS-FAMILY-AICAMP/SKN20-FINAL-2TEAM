<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="styles.css">
    
    <!-- Toast System -->
    <link rel="stylesheet" href="toast.css">
    
    <title>로그인 - FTOGuard</title>
    
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css');
        
        * {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        :root {
            --primary: #FF6B35;
        }
        
        .text-primary { color: var(--primary); }
        .bg-primary { background-color: var(--primary); }
        .border-primary { border-color: var(--primary); }
        .hover\:bg-primary\/90:hover { background-color: rgba(255, 107, 53, 0.9); }
        .focus\:ring-primary:focus { 
            --tw-ring-color: rgba(255, 107, 53, 0.5);
        }
    </style>
</head>
<body class="bg-neutral-50">

    <!-- 공통 헤더 -->
    <div id="app-header"></div>

    <!-- Login Container -->
    <div class="min-h-screen flex items-center justify-center p-6 pt-32 pb-20">
        <div class="w-full max-w-md">
            <!-- 제목 -->
            <div class="text-center mb-8">
                <h1 class="text-2xl md:text-3xl font-bold text-black mb-2">환영합니다</h1>
                <p class="text-sm text-neutral-600">FTOGuard에 로그인하세요</p>
            </div>

            <!-- 로그인 폼 -->
            <div class="bg-white p-8 md:p-10 rounded-3xl border border-neutral-200 shadow-lg">
                <form id="loginForm" class="space-y-5">
                    <!-- 이메일 -->
                    <div>
                        <label class="block text-xs font-semibold text-neutral-700 uppercase mb-2">이메일</label>
                        <input 
                            type="email" 
                            id="email" 
                            class="w-full px-4 py-3 bg-neutral-50 border border-neutral-200 rounded-xl focus:ring-2 focus:ring-primary focus:border-primary outline-none transition text-sm" 
                            placeholder="example@email.com" 
                            required
                            autocomplete="email"
                        >
                    </div>
                    
                    <!-- 비밀번호 -->
                    <div>
                        <label class="block text-xs font-semibold text-neutral-700 uppercase mb-2">비밀번호</label>
                        <input 
                            type="password" 
                            id="password" 
                            class="w-full px-4 py-3 bg-neutral-50 border border-neutral-200 rounded-xl focus:ring-2 focus:ring-primary focus:border-primary outline-none transition text-sm" 
                            placeholder="••••••••" 
                            required
                            autocomplete="current-password"
                        >
                    </div>
                    
                    <!-- 로그인 버튼 -->
                    <button 
                        type="submit" 
                        class="w-full py-3.5 bg-primary text-white rounded-xl font-semibold hover:bg-primary/90 transition-all shadow-md hover:shadow-lg text-sm"
                    >
                        로그인
                    </button>
                </form>

                <!-- 구분선 -->
                <div class="relative my-6">
                    <div class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-neutral-200"></div>
                    </div>
                    <div class="relative flex justify-center text-xs">
                        <span class="px-3 bg-white text-neutral-500 uppercase font-medium">또는</span>
                    </div>
                </div>

                <!-- 하단 링크 -->
                <div class="space-y-3 text-center">
                    <p class="text-sm text-neutral-600">
                        계정이 없으신가요? 
                        <a href="signup.html" class="text-primary font-semibold hover:underline">회원가입</a>
                    </p>
                    <p class="text-sm text-neutral-600">
                        <a href="forgot-password.html" class="text-primary font-semibold hover:underline">비밀번호를 잊으셨나요?</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Scripts -->
    <script src="toast.js"></script>
    <script src="script.js"></script>
    <script src="auth.js"></script>
    
    <script>
        // Load header.html
        fetch('header.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('app-header').innerHTML = data;
                
                const scripts = document.getElementById('app-header').querySelectorAll('script');
                scripts.forEach(script => {
                    const newScript = document.createElement('script');
                    if (script.src) {
                        newScript.src = script.src;
                    } else {
                        newScript.textContent = script.textContent;
                    }
                    document.body.appendChild(newScript);
                });
            })
            .catch(error => console.error('Error loading header:', error));
    </script>
</body>
</html>
