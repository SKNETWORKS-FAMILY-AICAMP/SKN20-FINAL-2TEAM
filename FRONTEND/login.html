<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="styles.css">
    
    <!-- Toast System -->
    <link rel="stylesheet" href="toast.css">
    
    <title>로그인 - FTOGuard</title>
</head>
<body class="bg-slate-50">

    <!-- ✅ 공통 헤더 -->
    <div id="app-header"></div>

    <!-- Login Container -->
    <div class="min-h-screen flex items-center justify-center p-6 pt-32">
        <div class="w-full max-w-md">
            <div class="text-center mb-10">
                <h1 class="text-3xl font-extrabold text-slate-800 mb-2">환영합니다</h1>
                <p class="text-slate-500 font-medium">AI 에이전트 서비스에 접속하세요</p>
            </div>

            <div class="bg-white p-10 rounded-[2rem] border border-slate-100 shadow-2xl shadow-slate-200/50">
                <form id="loginForm" class="space-y-6">
                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase mb-2 ml-1">Email Address</label>
                        <input type="email" id="email" class="w-full px-5 py-4 bg-slate-50 border border-slate-100 rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none transition" placeholder="example@email.com" required>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase mb-2 ml-1">Password</label>
                        <input type="password" id="password" class="w-full px-5 py-4 bg-slate-50 border border-slate-100 rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none transition" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="w-full py-4 bg-slate-900 text-white rounded-2xl font-bold hover:bg-blue-600 transition-all shadow-lg">로그인</button>
                </form>

                <div class="mt-8 pt-8 border-t border-slate-50 text-center">
                    <p class="text-sm text-slate-500">계정이 없으신가요? <a href="signup.html" class="text-blue-600 font-bold hover:underline">회원가입</a></p>
                    <p class="text-sm text-slate-500 mt-2"><a href="forgot-password.html" class="text-blue-600 font-bold hover:underline">비밀번호를 잊으셨나요?</a></p>
                </div>
            </div>
        </div>
    </div>
    
    <script src="toast.js"></script>
    <script src="script.js"></script>
    <script src="auth.js"></script>
</body>
</html>
