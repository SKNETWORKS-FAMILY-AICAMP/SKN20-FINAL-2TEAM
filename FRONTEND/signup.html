<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="styles.css">
    
    <!-- Toast System -->
    <link rel="stylesheet" href="toast.css">
    
    <title>회원가입 - FTOGuard</title>
    
    <style>
        /* Password Strength Bar */
        .strength-bar {
            width: 100%;
            height: 4px;
            background: #E5E7EB;
            border-radius: 2px;
            overflow: hidden;
            margin-top: 8px;
        }
        
        .strength-fill {
            height: 100%;
            width: 0%;
            transition: all 0.3s ease;
            background: #9CA3AF;
        }
        
        .strength-fill.weak {
            width: 33%;
            background: linear-gradient(90deg, #EF4444 0%, #DC2626 100%);
        }
        
        .strength-fill.medium {
            width: 66%;
            background: linear-gradient(90deg, #F59E0B 0%, #D97706 100%);
        }
        
        .strength-fill.strong {
            width: 100%;
            background: linear-gradient(90deg, #10B981 0%, #059669 100%);
        }
        
        .strength-text {
            font-size: 12px;
            margin-top: 4px;
            color: #6B7280;
        }
        
        /* Password Requirements */
        .password-requirements {
            list-style: none;
            margin-top: 12px;
            space-y: 6px;
        }
        
        .password-requirements li {
            font-size: 13px;
            color: #9CA3AF;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 0;
        }
        
        .password-requirements li::before {
            content: '○';
            color: #D1D5DB;
            font-size: 18px;
        }
        
        .password-requirements li.valid {
            color: #10B981;
        }
        
        .password-requirements li.valid::before {
            content: '✓';
            color: #10B981;
            font-weight: bold;
        }
        
        /* Form Hints */
        .form-hint {
            font-size: 13px;
            margin-top: 6px;
            display: block;
        }
        
        .form-hint.success {
            color: #10B981;
        }
        
        .form-hint.error {
            color: #EF4444;
        }
        
        /* Password Toggle */
        .password-input-wrapper {
            position: relative;
        }
        
        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #9CA3AF;
            cursor: pointer;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .password-toggle:hover {
            color: #4B5563;
        }
        
        /* Auth Divider */
        .auth-divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 24px 0;
        }
        
        .auth-divider::before,
        .auth-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #E5E7EB;
        }
        
        .auth-divider span {
            color: #9CA3AF;
            font-size: 14px;
        }
        
        /* Social Button */
        .btn-social {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #E5E7EB;
            border-radius: 12px;
            background: white;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-center: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn-social:hover {
            background: #F9FAFB;
            border-color: #D1D5DB;
        }
    </style>
</head>

<body class="bg-slate-50">

    <!-- ✅ 공통 헤더 -->
    <div id="app-header"></div>

    <!-- Main Content -->
    <main class="min-h-screen flex items-center justify-center p-6 pt-32 pb-20">
        <div class="w-full max-w-md">
            <div class="text-center mb-10">
                <h1 class="text-3xl font-extrabold text-slate-800 mb-2">회원가입</h1>
                <p class="text-slate-500 font-medium">FTOGuard 계정을 만들어보세요</p>
            </div>

            <div class="bg-white p-10 rounded-[2rem] border border-slate-100 shadow-2xl shadow-slate-200/50">
                <form id="signupForm" class="space-y-6">
                    <!-- 이름 -->
                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase mb-2 ml-1">이름</label>
                        <input 
                            type="text" 
                            id="signupName" 
                            class="w-full px-5 py-4 bg-slate-50 border border-slate-100 rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none transition" 
                            placeholder="홍길동"
                            required
                            autocomplete="name"
                        />
                    </div>

                    <!-- ✅ 이메일 - 수정됨 -->
                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase mb-2 ml-1">이메일</label>
                        <div class="relative">
                            <input 
                                type="email" 
                                id="signupEmail" 
                                class="w-full px-5 py-4 pr-12 bg-slate-50 border border-slate-100 rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none transition" 
                                placeholder="example@email.com"
                                required
                                autocomplete="email"
                            />
                            <!-- ✅ 새로 추가 - 아이콘 영역 -->
                            <span id="emailIcon" class="absolute right-4 top-1/2 transform -translate-y-1/2"></span>
                        </div>
                        <!-- ✅ 새로 추가 - 피드백 영역 -->
                        <div id="emailFeedback" class="text-sm mt-1"></div>
                    </div>

                    <!-- 비밀번호 -->
                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase mb-2 ml-1">비밀번호</label>
                        <div class="password-input-wrapper">
                            <input 
                                type="password" 
                                id="signupPassword" 
                                class="w-full px-5 py-4 pr-12 bg-slate-50 border border-slate-100 rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none transition" 
                                placeholder="8자 이상 입력하세요"
                                required
                                autocomplete="new-password"
                            />
                            <button type="button" class="password-toggle" id="toggleSignupPassword">
                                <i class="fas fa-eye text-lg"></i>
                            </button>
                        </div>
                        
                        <!-- 비밀번호 강도 -->
                        <div class="strength-bar">
                            <div class="strength-fill" id="strengthFill"></div>
                        </div>
                        <p class="strength-text" id="strengthText">비밀번호 강도</p>
                        
                        <!-- 비밀번호 요구사항 -->
                        <ul class="password-requirements">
                            <li id="req-length">최소 8자 이상</li>
                            <li id="req-upper">대문자 포함</li>
                            <li id="req-number">숫자 포함</li>
                        </ul>
                    </div>

                    <!-- 비밀번호 확인 -->
                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase mb-2 ml-1">비밀번호 확인</label>
                        <div class="password-input-wrapper">
                            <input 
                                type="password" 
                                id="confirmPassword" 
                                class="w-full px-5 py-4 pr-12 bg-slate-50 border border-slate-100 rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none transition" 
                                placeholder="비밀번호를 다시 입력하세요"
                                required
                                autocomplete="new-password"
                            />
                            <button type="button" class="password-toggle" id="toggleConfirmPassword">
                                <i class="fas fa-eye text-lg"></i>
                            </button>
                        </div>
                        <p class="form-hint" id="passwordMatchHint"></p>
                    </div>

                    <!-- 약관 동의 -->
                    <div>
                        <label class="flex items-start space-x-3 cursor-pointer">
                            <input type="checkbox" id="agreeTerms" required class="mt-1 w-4 h-4 text-blue-600 border-slate-300 rounded focus:ring-blue-500">
                            <span class="text-sm text-slate-600">
                                <a href="#" class="text-blue-600 font-bold hover:underline">이용약관</a> 및 
                                <a href="#" class="text-blue-600 font-bold hover:underline">개인정보처리방침</a>에 동의합니다
                            </span>
                        </label>
                    </div>

                    <!-- 제출 버튼 -->
                    <button 
                        type="submit" 
                        class="w-full py-4 bg-slate-900 text-white rounded-2xl font-bold hover:bg-blue-600 transition-all shadow-lg disabled:bg-slate-300 disabled:cursor-not-allowed" 
                        id="signupBtn" 
                        disabled
                    >
                        회원가입
                    </button>
                </form>

                <!-- 구분선 -->
                <div class="auth-divider">
                    <span>또는</span>
                </div>

                <!-- 소셜 로그인 -->
                <button class="btn-social">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M18.1713 8.36788H17.5001V8.33329H10.0001V11.6666H14.7096C14.0225 13.6069 12.1763 15 10.0001 15C7.23882 15 5.00007 12.7612 5.00007 9.99996C5.00007 7.23871 7.23882 4.99996 10.0001 4.99996C11.2746 4.99996 12.4342 5.48079 13.3171 6.26621L15.6742 3.90913C14.1859 2.52204 12.1951 1.66663 10.0001 1.66663C5.39799 1.66663 1.66674 5.39788 1.66674 9.99996C1.66674 14.602 5.39799 18.3333 10.0001 18.3333C14.6022 18.3333 18.3334 14.602 18.3334 9.99996C18.3334 9.44121 18.2767 8.89579 18.1713 8.36788Z" fill="#FFC107"/>
                        <path d="M2.6275 6.12121L5.36542 8.12913C6.10625 6.29496 7.90042 4.99996 10.0004 4.99996C11.2750 4.99996 12.4346 5.48079 13.3175 6.26621L15.6746 3.90913C14.1863 2.52204 12.1954 1.66663 10.0004 1.66663C6.79917 1.66663 4.02334 3.47371 2.6275 6.12121Z" fill="#FF3D00"/>
                        <path d="M10.0001 18.3333C12.1526 18.3333 14.1101 17.5095 15.5876 16.1712L13.0084 13.9875C12.1463 14.6479 11.0901 15.0008 10.0001 15C7.83258 15 5.99175 13.6179 5.29883 11.6891L2.58008 13.7829C3.96091 16.4816 6.76133 18.3333 10.0001 18.3333Z" fill="#4CAF50"/>
                        <path d="M18.1713 8.36796H17.5V8.33337H10V11.6667H14.7096C14.3809 12.5902 13.7889 13.3972 13.0067 13.988L13.0079 13.9871L15.5871 16.1709C15.4046 16.3371 18.3333 14.1667 18.3333 10C18.3333 9.44129 18.2767 8.89587 18.1713 8.36796Z" fill="#1976D2"/>
                    </svg>
                    Google로 계속하기
                </button>

                <!-- 로그인 링크 -->
                <div class="mt-8 text-center">
                    <p class="text-sm text-slate-500">
                        이미 계정이 있으신가요? 
                        <a href="login.html" class="text-blue-600 font-bold hover:underline">로그인</a>
                    </p>
                </div>
            </div>
        </div>
    </main>

    <script src="toast.js"></script>
    <script src="script.js"></script>
    <script src="auth.js"></script>
    
    <!-- ✅ 새로 추가 - 이메일 중복 체크 -->
    <script src="email-api-integration.js"></script>
    
    <script>
        // Password toggle functionality
        document.getElementById('toggleSignupPassword').addEventListener('click', function() {
            const input = document.getElementById('signupPassword');
            const icon = this.querySelector('i');
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        });
        
        document.getElementById('toggleConfirmPassword').addEventListener('click', function() {
            const input = document.getElementById('confirmPassword');
            const icon = this.querySelector('i');
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        });
    </script>
</body>
</html>
