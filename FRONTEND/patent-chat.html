<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <!-- Toast System -->
    <link rel="stylesheet" href="toast.css">

    <title>특허·실용신안 리스크 분석 AI - FTOGuard</title>

    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css');

        * {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        :root {
            --primary: #FF6B35;
            --primary-dark: #E55A2B;
            --primary-light: #FF8C5A;
            --primary-bg: rgba(255, 107, 53, 0.06);
            --primary-bg-hover: rgba(255, 107, 53, 0.10);
            --primary-border: rgba(255, 107, 53, 0.18);
        }

        .text-primary { color: var(--primary); }
        .bg-primary { background-color: var(--primary); }
        .border-primary { border-color: var(--primary); }
        .hover\:bg-primary\/90:hover { background-color: rgba(255, 107, 53, 0.9); }

        /* 사이드바 */
        #sidebar {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        #sidebar.sidebar-hidden {
            transform: translateX(-100%);
        }
        #sidebarOpenBtn {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease 0.15s;
        }
        #sidebarOpenBtn.visible {
            opacity: 1;
            pointer-events: auto;
        }

        /* 모바일: 사이드바 오버레이 모드 */
        @media (max-width: 1023px) {
            #sidebar {
                transform: translateX(-100%);
                z-index: 50;
            }
            #sidebar.sidebar-open {
                transform: translateX(0);
            }
            #sidebarOpenBtn {
                opacity: 1;
                pointer-events: auto;
            }
            #mainContent {
                margin-left: 0 !important;
            }
            #sidebarBackdrop {
                display: none;
                position: fixed;
                inset: 0;
                background: rgba(0, 0, 0, 0.3);
                z-index: 45;
            }
            #sidebarBackdrop.active {
                display: block;
            }
        }

        .icon-btn {
            width: 2rem;
            height: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #A3A3A3;
            border-radius: 0.5rem;
            transition: all 0.15s ease;
            background: transparent;
            border: none;
            cursor: pointer;
        }
        .icon-btn:hover {
            color: var(--primary);
            background: var(--primary-bg);
        }

        /* Session Card */
        .session-card {
            background: white;
            border: 1px solid #E5E5E5;
            border-radius: 1rem;
            padding: 1.25rem;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 0.75rem;
        }
        .session-card:hover {
            border-color: var(--primary);
            box-shadow: 0 4px 16px rgba(255, 107, 53, 0.08);
            transform: translateY(-2px);
        }
        .session-card.active {
            background: #FFF5F0;
            border-color: var(--primary);
            box-shadow: 0 4px 16px rgba(255, 107, 53, 0.12);
        }

        /* 스크롤바 */
        #chatSessions::-webkit-scrollbar { width: 6px; }
        #chatSessions::-webkit-scrollbar-track { background: transparent; }
        #chatSessions::-webkit-scrollbar-thumb { background: #D4D4D4; border-radius: 3px; }
        #chatSessions::-webkit-scrollbar-thumb:hover { background: var(--primary); }

        #messagesArea::-webkit-scrollbar { width: 6px; }
        #messagesArea::-webkit-scrollbar-track { background: transparent; }
        #messagesArea::-webkit-scrollbar-thumb { background: #D4D4D4; border-radius: 3px; }
        #messagesArea::-webkit-scrollbar-thumb:hover { background: var(--primary); }

        .type-badge {
            font-size: 0.7rem;
            font-weight: 600;
            padding: 0.2rem 0.5rem;
            border-radius: 0.5rem;
            border: 1px solid var(--primary-border);
            background: var(--primary-bg);
            color: var(--primary);
            white-space: nowrap;
        }

        /* 메시지 스타일 */
        .msg { display: flex; gap: 0.75rem; margin-bottom: 1.25rem; }
        .msg.user { flex-direction: row-reverse; }

        .msg-avatar {
            width: 2.25rem;
            height: 2.25rem;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 0.8rem;
        }
        .msg.assistant .msg-avatar {
            background: var(--primary);
            color: white;
        }
        .msg.user .msg-avatar {
            background: #10B981;
            color: white;
        }

        .msg-content { flex: 1; max-width: 80%; }
        .msg.user .msg-content {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .msg-bubble {
            padding: 0.875rem 1.125rem;
            border-radius: 1rem;
            line-height: 1.65;
            font-size: 0.9rem;
        }
        .msg.assistant .msg-bubble {
            background: white;
            border: 1px solid #E5E5E5;
            border-top-left-radius: 0.25rem;
        }
        .msg.user .msg-bubble {
            background: var(--primary);
            color: white;
            border-top-right-radius: 0.25rem;
        }

        /* 타이핑 인디케이터 */
        .typing-indicator { display: flex; gap: 0.25rem; padding: 0.75rem; }
        .typing-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: #A3A3A3;
            animation: typing 1.4s infinite;
        }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.7; }
            30% { transform: translateY(-10px); opacity: 1; }
        }

        /* 리포트 박스 */
        .report-box {
            white-space: pre-wrap;
            font-size: 0.9rem;
            line-height: 1.7;
            background: #FFF7F2;
            padding: 1rem;
            border-radius: 0.75rem;
            border-left: 4px solid var(--primary);
        }

        /* 결과 이동 배너 */
        .result-ready-banner {
            background: linear-gradient(135deg, #FFF5F0, #FFF0E8);
            border: 1.5px solid var(--primary-border);
            border-radius: 1rem;
            padding: 1rem 1.25rem;
            margin-top: 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        /* 스텝 넘버 */
        .step-num {
            width: 1.5rem;
            height: 1.5rem;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 1px 3px rgba(255, 107, 53, 0.15);
            color: white;
            font-size: 0.65rem;
            font-weight: 700;
        }
        .step-num.step-1 { background: var(--primary); }
        .step-num.step-2 { background: var(--primary-light); }
        .step-num.step-3 { background: var(--primary-dark); }

        /* ===== TOP 10 특허 리스트 ===== */
        .patent-list-card {
            background: white;
            border: 1px solid #E5E5E5;
            border-radius: 1rem;
            overflow: hidden;
        }
        .patent-list-header {
            padding: 0.875rem 1.25rem;
            background: linear-gradient(135deg, var(--primary-bg), rgba(255, 140, 90, 0.04));
            border-bottom: 1px solid var(--primary-border);
        }
        .patent-list-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.625rem 1.25rem;
            border-bottom: 1px solid #F5F5F5;
            font-size: 0.8rem;
            transition: background 0.15s;
        }
        .patent-list-item:hover { background: #FAFAFA; }
        .patent-list-item:last-child { border-bottom: none; }
        .patent-rank-badge {
            width: 1.5rem; height: 1.5rem;
            border-radius: 0.375rem;
            background: rgba(255,107,53,0.08);
            color: var(--primary);
            font-size: 0.65rem; font-weight: 800;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .patent-status-badge {
            font-size: 0.6rem; font-weight: 600;
            padding: 0.1rem 0.35rem; border-radius: 0.25rem;
        }
        .patent-status-badge.registered { background: #DCFCE7; color: #16A34A; }
        .patent-status-badge.published { background: #DBEAFE; color: #2563EB; }

        /* 개별 분석 버튼 */
        .patent-analyze-btn {
            font-size: 0.6rem; font-weight: 700;
            padding: 0.2rem 0.5rem; border-radius: 0.375rem;
            border: 1px solid var(--primary);
            color: var(--primary);
            background: white;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .patent-analyze-btn:hover { background: var(--primary); color: white; }
        .patent-analyze-btn:disabled { border-color: #D4D4D4; color: #A3A3A3; cursor: default; background: #F5F5F5; }
        .patent-analyze-btn.done { border-color: #16A34A; color: #16A34A; background: #F0FDF4; cursor: pointer; }
        .patent-analyze-btn.done:hover { background: #16A34A; color: white; }
        .patent-analyze-btn.risk-high { border-color: #DC2626; color: #DC2626; background: #FEF2F2; cursor: pointer; font-size: 0.55rem; }
        .patent-analyze-btn.risk-high:hover { background: #DC2626; color: white; }
        .patent-analyze-btn.risk-medium { border-color: #D97706; color: #D97706; background: #FFFBEB; cursor: pointer; font-size: 0.55rem; }
        .patent-analyze-btn.risk-medium:hover { background: #D97706; color: white; }
        .patent-analyze-btn.risk-low { border-color: #16A34A; color: #16A34A; background: #F0FDF4; cursor: pointer; font-size: 0.55rem; }
        .patent-analyze-btn.risk-low:hover { background: #16A34A; color: white; }
        .patent-analyze-btn.risk-info { border-color: #6B7280; color: #6B7280; background: #F9FAFB; cursor: pointer; font-size: 0.55rem; }
        .patent-analyze-btn.risk-info:hover { background: #6B7280; color: white; }

        /* PDF 저장 버튼 */
        .pdf-export-btn {
            display: flex; align-items: center; justify-content: center; gap: 0.5rem;
            width: 100%; padding: 0.75rem;
            background: linear-gradient(135deg, #1E40AF, #3B82F6);
            color: white; border: none; border-radius: 0.75rem;
            font-size: 0.8rem; font-weight: 700;
            cursor: pointer; transition: all 0.2s;
            margin-top: 1rem;
        }
        .pdf-export-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(30,64,175,0.3); }
        .pdf-export-btn:disabled { opacity: 0.5; cursor: default; transform: none; }

        /* ===== 분석 프로그레스 ===== */
        .analysis-progress {
            background: white;
            border: 1px solid #E5E5E5;
            border-radius: 1rem;
            padding: 1rem 1.25rem;
        }
        .progress-step-chat {
            display: flex; align-items: center; gap: 0.75rem;
            padding: 0.5rem 0;
            font-size: 0.8rem; color: #A3A3A3;
            transition: color 0.3s;
        }
        .progress-step-chat.active { color: #171717; }
        .progress-step-chat.done { color: #16A34A; }
        .progress-step-icon {
            width: 1.5rem; height: 1.5rem; border-radius: 50%;
            border: 2px solid #E5E5E5;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.6rem; flex-shrink: 0;
            transition: all 0.3s;
        }
        .progress-step-chat.active .progress-step-icon {
            border-color: var(--primary); color: var(--primary);
            background: rgba(255,107,53,0.08);
            animation: stepPulse 1s ease-in-out infinite;
        }
        .progress-step-chat.done .progress-step-icon {
            border-color: #16A34A; color: white; background: #16A34A;
        }
        @keyframes stepPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255,107,53,0.3); }
            50% { box-shadow: 0 0 0 4px rgba(255,107,53,0); }
        }

        /* ===== 오른쪽 결과 패널 ===== */
        #resultPanel {
            position: fixed;
            top: 80px;
            right: 0;
            bottom: 0;
            width: 55%;
            max-width: 720px;
            background: white;
            border-left: 1px solid #E5E5E5;
            box-shadow: -4px 0 24px rgba(0,0,0,0.08);
            z-index: 50;
            transform: translateX(100%);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-y: auto;
        }
        #resultPanel.open { transform: translateX(0); }
        #resultPanel::-webkit-scrollbar { width: 6px; }
        #resultPanel::-webkit-scrollbar-track { background: transparent; }
        #resultPanel::-webkit-scrollbar-thumb { background: #D4D4D4; border-radius: 3px; }

        /* (패널 닫기 탭 제거됨 — X 버튼 sticky로 대체) */

        #mainContent.panel-open {
            margin-right: 55%;
            transition: margin-right 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* 결과보기 버튼 */
        .result-view-btn {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            padding: 0.625rem 1.25rem;
            border-radius: 0.75rem;
            font-weight: 700;
            font-size: 0.8rem;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(255, 107, 53, 0.3);
            white-space: nowrap;
        }
        .result-view-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(255, 107, 53, 0.4);
        }

        /* 패널 내부 카드 */
        .panel-patent-card {
            border: 1px solid #E5E5E5;
            border-radius: 0.75rem;
            padding: 1.25rem;
            margin-bottom: 1.25rem;
            background: #FAFAFA;
        }
        .panel-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.75rem;
            table-layout: fixed;
        }
        .panel-table th {
            background: #F5F5F5;
            font-weight: 700;
            text-align: left;
            padding: 0.5rem 0.6rem;
            border-bottom: 2px solid #E5E5E5;
            font-size: 0.7rem;
            color: #525252;
            white-space: nowrap;
        }
        .panel-table th:nth-child(1) { width: 42%; }
        .panel-table th:nth-child(2) { width: 42%; }
        .panel-table th:nth-child(3) { width: 16%; text-align: center; }
        .panel-table td {
            padding: 0.5rem 0.6rem;
            border-bottom: 1px solid #F0F0F0;
            vertical-align: top;
            line-height: 1.4;
            word-break: break-word;
        }
        .panel-table td:nth-child(3) { text-align: center; white-space: nowrap; }
        .corr-badge {
            display: inline-block;
            padding: 0.15rem 0.4rem;
            border-radius: 0.25rem;
            font-size: 0.65rem;
            font-weight: 600;
            white-space: nowrap;
        }
        .corr-badge.match { background: #FEE2E2; color: #DC2626; }
        .corr-badge.no-match { background: #DBEAFE; color: #2563EB; }
        .corr-badge.unknown { background: #F5F5F5; color: #737373; }
    </style>
</head>

<body style="background-color: #FFF7F2;">
    <!-- 공통 헤더 -->
    <div id="app-header"></div>

    <!-- 사이드바 열기 버튼 -->
    <button
        id="sidebarOpenBtn"
        onclick="toggleSidebar()"
        class="fixed left-3 top-24 z-50 icon-btn bg-white border border-neutral-200 shadow-md"
        title="사이드바 열기"
        style="width: 2rem; height: 2rem;"
    >
        <i class="fas fa-chevron-right text-xs"></i>
    </button>

    <div class="flex h-screen">
        <!-- 사이드바 -->
        <div id="sidebarBackdrop" onclick="toggleSidebar()"></div>
        <aside id="sidebar" class="w-72 bg-white border-r border-neutral-200 flex flex-col fixed left-0 top-20 bottom-0 z-40">
            <!-- Header -->
            <div class="p-6 border-b border-neutral-200">
                <div class="flex items-center justify-between mb-5">
                    <h3 class="text-neutral-900 text-sm font-bold">특허·실용신안 분석 기록</h3>
                    <div class="flex items-center gap-2">
                        <button onclick="startNewChat()" class="icon-btn" title="새 분석">
                            <i class="fas fa-plus text-xs"></i>
                        </button>
                        <button onclick="toggleSidebar()" class="icon-btn" title="사이드바 접기">
                            <i class="fas fa-chevron-left text-xs" id="toggleIcon"></i>
                        </button>
                    </div>
                </div>

                <!-- Stats -->
                <div class="grid grid-cols-2 gap-3">
                    <div class="bg-neutral-50 rounded-xl p-4 border border-neutral-200">
                        <div class="text-2xl font-bold text-black" id="totalCount">0</div>
                        <div class="text-xs text-neutral-600 mt-1">Total</div>
                    </div>
                    <div class="rounded-xl p-4 border" style="background: var(--primary-bg); border-color: var(--primary-border);">
                        <div class="text-2xl font-bold text-primary" id="sessionStatus">대기</div>
                        <div class="text-xs text-neutral-600 mt-1">상태</div>
                    </div>
                </div>
            </div>

            <!-- Session List -->
            <div class="flex-1 overflow-y-auto p-4" id="chatSessions">
                <div class="text-center py-8">
                    <div class="w-14 h-14 bg-neutral-50 rounded-2xl flex items-center justify-center mx-auto mb-3 border border-neutral-200">
                        <i class="fas fa-file-alt text-xl text-neutral-400"></i>
                    </div>
                    <p class="text-neutral-500 text-xs">기술 구성을 입력하여<br>특허 분석을 시작하세요</p>
                </div>
            </div>
        </aside>

        <!-- 메인 영역 -->
        <main id="mainContent" class="flex-1 ml-0 lg:ml-72 transition-all duration-300" style="margin-left: 18rem; background-color: #FFF7F2;">
            <div class="h-screen flex flex-col" style="padding-top: 80px;">

                <!-- 메시지 영역 -->
                <div class="flex-1 overflow-y-auto p-5" id="messagesArea">
                    <div class="max-w-4xl mx-auto" id="messagesWrapper">

                        <!-- Welcome -->
                        <div id="welcomeMessage" class="text-center py-10">
                            <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl mb-4" style="background: rgba(255, 107, 53, 0.10);">
                                <i class="fas fa-file-alt text-2xl text-primary"></i>
                            </div>
                            <h1 class="text-xl font-bold text-black mb-2">특허·실용신안 리스크 분석 AI</h1>
                            <p class="text-neutral-500 text-sm mb-6">
                                화장품 기술 구성을 입력하면 AI가 대화를 통해 리스크를 분석하고<br>충분한 정보가 모이면 상세 결과 리포트를 제공합니다
                            </p>

                            <!-- 분석 프로세스 -->
                            <div class="border rounded-xl p-4 mb-5 max-w-md mx-auto" style="background: linear-gradient(135deg, var(--primary-bg), rgba(255, 140, 90, 0.04)); border-color: var(--primary-border);">
                                <p class="text-xs font-bold text-black mb-3 flex items-center justify-center gap-1.5">
                                    <i class="fas fa-lightbulb text-primary"></i>
                                    분석 프로세스
                                </p>
                                <div class="flex flex-col gap-2.5 text-left">
                                    <div class="flex items-center gap-3">
                                        <div class="step-num step-1"><span>1</span></div>
                                        <span class="text-xs text-neutral-700">기술 구성 입력 → AI가 추가 정보 요청</span>
                                    </div>
                                    <div class="flex items-center gap-3">
                                        <div class="step-num step-2"><span>2</span></div>
                                        <span class="text-xs text-neutral-700">대화를 통해 성분·제형·목적 구체화</span>
                                    </div>
                                    <div class="flex items-center gap-3">
                                        <div class="step-num step-3"><span>3</span></div>
                                        <span class="text-xs text-neutral-700">충분한 정보 수집 → 상세 결과 리포트</span>
                                    </div>
                                </div>
                            </div>

                            <!-- CTA 버튼 -->
                            <div class="flex justify-center gap-3">
                                <button onclick="fillQuery('세라마이드·판테놀 기반 피부장벽 강화 크림 조성물을 분석해줘')"
                                    class="px-5 py-2.5 bg-primary hover:bg-primary/90 text-white rounded-full font-semibold text-sm transition-all shadow-md hover:shadow-lg flex items-center gap-2">
                                    <i class="fas fa-bolt"></i>
                                    예시로 시작하기
                                </button>
                                <button onclick="document.getElementById('messageInput').focus()"
                                    class="px-5 py-2.5 bg-white border border-neutral-200 text-neutral-700 hover:border-primary hover:text-primary rounded-full font-semibold text-sm transition-all">
                                    <i class="fas fa-pencil-alt mr-1"></i>
                                    직접 입력하기
                                </button>
                            </div>
                        </div>

                    </div>
                </div>

                <!-- 입력 영역 -->
                <div class="border-t border-neutral-200 bg-white p-6 shadow-sm">
                    <div class="max-w-4xl mx-auto">
                        <!-- 입력 행 -->
                        <div class="flex items-center gap-3">
                            <textarea
                                id="messageInput"
                                placeholder="화장품 기술 구성을 입력하세요 (예: 히알루론산·나이아신아마이드 함유 저자극 수분 앰플 조성물)..."
                                rows="1"
                                class="flex-1 px-5 py-3 border border-neutral-200 rounded-xl focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 text-sm resize-none"
                                style="max-height: 120px; min-height: 44px;"
                            ></textarea>
                            <button id="sendBtn" disabled
                                class="px-6 py-3 bg-primary hover:bg-primary/90 text-white rounded-xl font-bold text-sm transition-all shadow-md hover:shadow-lg flex items-center gap-2 disabled:opacity-40 disabled:cursor-not-allowed disabled:shadow-none">
                                <i class="fas fa-paper-plane"></i>
                                전송
                            </button>
                        </div>
                        <p class="text-xs text-neutral-400 mt-2 text-center">
                            Shift + Enter로 줄바꿈 &middot; Enter로 전송
                        </p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- 오른쪽 결과 패널 -->
    <div id="resultPanel">
        <div style="position:sticky; top:0; background:white; z-index:10; padding:1.5rem 1.5rem 0 1.5rem;">
            <div class="flex items-center justify-between mb-5">
                <h2 id="resultPanelTitle" class="text-base font-bold text-black flex items-center gap-2">
                    <i class="fas fa-chart-bar text-primary"></i>
                    구성 대비 결과
                </h2>
                <button onclick="closeResultPanel()" class="icon-btn" title="닫기">
                    <i class="fas fa-times"></i>
                </button>
            </div>
        </div>
        <div id="resultPanelContent" style="padding:0 1.5rem 1.5rem 1.5rem;"></div>
        <div style="padding:0 1.5rem 1.5rem 1.5rem;">
            <button class="pdf-export-btn" onclick="exportResultPDF()">
                <i class="fas fa-file-pdf"></i>
                PDF로 저장하기
            </button>
        </div>
    </div>

    <script src="toast.js"></script>
    <script src="script.js"></script>

    <script>
    // ==================== 설정 ====================
    const API_BASE = '/api';

    // ==================== 상태 ====================
    let threadId = null;
    let sessionCount = 0;
    let isAnalyzing = false;
    let currentAbortController = null;
    let searchToken = null;
    let searchResults = null;
    let patentAnalyses = [];
    let currentAnalysisId = null;
    const analysesHistory = new Map(); // analysisId → patentAnalyses 보존

    // ==================== DOM ====================
    const messagesWrapper = document.getElementById('messagesWrapper');
    const messageInput    = document.getElementById('messageInput');
    const sendBtn         = document.getElementById('sendBtn');
    const welcomeMessage  = document.getElementById('welcomeMessage');

    // ==================== 이벤트 ====================
    messageInput.addEventListener('input', () => {
        updateSendButton();
        autoResize();
    });

    messageInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            if (!sendBtn.disabled) handleSend();
        }
    });

    sendBtn.addEventListener('click', handleSend);

    function autoResize() {
        messageInput.style.height = 'auto';
        messageInput.style.height = Math.min(messageInput.scrollHeight, 120) + 'px';
    }

    function updateSendButton() {
        sendBtn.disabled = isAnalyzing || !messageInput.value.trim();
    }

    function fillQuery(text) {
        messageInput.value = text;
        autoResize();
        updateSendButton();
        messageInput.focus();
    }

    // ==================== API 호출 ====================

    function authHeaders() {
        const token = localStorage.getItem('authToken') || '';
        return token ? { 'Authorization': `Bearer ${token}` } : {};
    }

    async function callSearchAPI(message) {
        const formData = new FormData();
        formData.append('message', message);
        if (threadId) formData.append('session_id', threadId);
        const resp = await fetch(`${API_BASE}/chat/search`, {
            method: 'POST',
            headers: authHeaders(),
            body: formData,
        });
        if (!resp.ok) {
            const err = await resp.json().catch(() => ({}));
            throw new Error(err.detail || `검색 실패: HTTP ${resp.status}`);
        }
        return resp.json();
    }

    async function callAnalyzePatentAPI(token, index) {
        const formData = new FormData();
        formData.append('search_token', token);
        formData.append('patent_index', index);
        const resp = await fetch(`${API_BASE}/chat/analyze-patent`, {
            method: 'POST',
            headers: authHeaders(),
            body: formData,
        });
        if (!resp.ok) {
            const err = await resp.json().catch(() => ({}));
            throw new Error(err.detail || `분석 실패: HTTP ${resp.status}`);
        }
        return resp.json();
    }

    async function callFinalizeAPI(token, analyses) {
        const formData = new FormData();
        formData.append('search_token', token);
        formData.append('patent_analyses_json', JSON.stringify(analyses));
        const resp = await fetch(`${API_BASE}/chat/finalize`, {
            method: 'POST',
            headers: authHeaders(),
            body: formData,
        });
        if (!resp.ok) {
            const err = await resp.json().catch(() => ({}));
            throw new Error(err.detail || `저장 실패: HTTP ${resp.status}`);
        }
        return resp.json();
    }

    // ==================== 메인 전송 (3단계) ====================

    async function handleSend() {
        const text = messageInput.value.trim();
        if (!text || isAnalyzing) return;

        if (welcomeMessage) welcomeMessage.remove();

        addUserMessage(text);
        messageInput.value = '';
        messageInput.style.height = 'auto';
        isAnalyzing = true;
        updateSendButton();

        try {
            // ── Phase 1: 검색 ──
            const isFollowUp = searchResults && searchResults.length > 0;
            setStatus('검색 중');
            addLoadingMessage(
                isFollowUp ? '새로운 구성요소로 유사 특허 재검색 중...' : '유사 특허 검색 중...',
                true
            );

            const searchResp = await callSearchAPI(text);

            stopSearchCounter();
            threadId = searchResp.session_id;
            searchToken = searchResp.search_token;
            searchResults = searchResp.search_results || [];

            if (searchResults.length === 0) {
                removeLoadingMessage();
                addAssistantMessage('검색 결과가 없습니다. 다른 제품 설명을 입력해 주세요.');
                return;
            }

            // 검색 완료 → 리스트 확인 중 메시지
            updateLoadingStatus(`유사문헌 TOP ${searchResults.length}건 리스트 확인 중...`);
            await new Promise(r => setTimeout(r, 800));
            removeLoadingMessage();

            addPatentListMessage(searchResults);

            // ── Phase 2: TOP 3 분석 ──
            setStatus('분석 중');
            const analyzeCount = Math.min(3, searchResults.length);
            const progressEl = addAnalysisProgress(analyzeCount);
            patentAnalyses = [];

            for (let i = 0; i < analyzeCount; i++) {
                setProgressStep(progressEl, i, 'active');
                const result = await callAnalyzePatentAPI(searchToken, i);
                result.patent_index = i;
                patentAnalyses.push(result);
                setProgressStep(progressEl, i, 'done');
                updatePatentButton(i, result);
            }

            // 4~10번 분석 버튼 활성화
            enableRemainingButtons();

            // ── Phase 3: 저장 ──
            const finalResp = await callFinalizeAPI(searchToken, patentAnalyses);
            currentAnalysisId = finalResp.analysis_id;

            // 분석 결과를 ID별로 보존 (덮어쓰기 방지)
            analysesHistory.set(currentAnalysisId, [...patentAnalyses]);

            addResultViewButton(patentAnalyses, currentAnalysisId);

            sessionCount++;
            updateTotalCount();
            addSessionCard(text, currentAnalysisId);
            setStatus('완료');

        } catch (error) {
            if (error.name === 'AbortError') return;
            removeLoadingMessage();
            addBotMessage(`분석 오류: ${error.message}`);
            setStatus('오류');
        } finally {
            isAnalyzing = false;
            updateSendButton();
        }
    }

    // ==================== TOP 10 특허 리스트 ====================

    function addPatentListMessage(results) {
        const div = document.createElement('div');
        div.className = 'msg assistant';
        const rows = results.slice(0, 10).map((r, i) => {
            const meta = r.metadata || {};
            const hasRegit = meta.regit_num && meta.regit_num.trim();
            const statusText = hasRegit ? '등록' : '공개';
            const statusClass = hasRegit ? 'registered' : 'published';
            const title = meta.invention_title || '(제목 없음)';
            const applyNum = meta.apply_num || r.patent_id || '-';
            const isTop3 = i < 3;
            return `
                <div class="patent-list-item">
                    <div class="patent-rank-badge">${i + 1}</div>
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center gap-2">
                            <span class="text-xs text-neutral-400">출원번호:</span>
                            <a href="https://kportal.kipris.or.kr/kportal/search/search_patent.do?queryText=AN%3D${applyNum.replace(/-/g, '')}"
                               target="_blank" rel="noopener"
                               class="text-xs font-mono hover:underline"
                               style="color: var(--primary);"
                               title="KIPRIS에서 조회"
                               onclick="event.stopPropagation();">${escapeHtml(applyNum)}</a>
                            <span class="patent-status-badge ${statusClass}">${statusText}</span>
                        </div>
                        <div class="text-xs text-neutral-700 mt-0.5 truncate">${escapeHtml(title)}</div>
                    </div>
                    <button class="patent-analyze-btn"
                            data-patent-index="${i}"
                            onclick="analyzeSinglePatent(this, ${i})"
                            ${isTop3 ? '' : 'disabled'}>
                        ${isTop3 ? '<i class="fas fa-spinner fa-spin" style="font-size:7px;"></i> 분석 예정' : '<i class="fas fa-microscope" style="font-size:7px;"></i> 분석'}
                    </button>
                </div>`;
        }).join('');

        div.innerHTML = `
            <div class="msg-avatar"><i class="fas fa-shield-alt text-xs"></i></div>
            <div class="msg-content" style="max-width:90%;">
                <div class="patent-list-card">
                    <div class="patent-list-header">
                        <div class="flex items-center gap-2">
                            <i class="fas fa-search text-primary text-xs"></i>
                            <span class="text-sm font-bold text-black">유사 특허 TOP 10</span>
                            <span class="text-xs text-neutral-500">${results.length}건 검색됨</span>
                        </div>
                    </div>
                    ${rows}
                </div>
            </div>`;
        messagesWrapper.appendChild(div);
        scrollToBottom();
    }

    // ==================== 분석 프로그레스 ====================

    function addAnalysisProgress(count) {
        const div = document.createElement('div');
        div.className = 'msg assistant';
        div.id = 'analysisProgress';
        const steps = Array.from({ length: count }, (_, i) => `
            <div class="progress-step-chat" id="progressStep${i}">
                <div class="progress-step-icon">
                    <i class="fas fa-circle" style="font-size:5px;"></i>
                </div>
                <span>${i + 1}번째 특허 구성대비 확인 대기</span>
            </div>`).join('');

        div.innerHTML = `
            <div class="msg-avatar"><i class="fas fa-shield-alt text-xs"></i></div>
            <div class="msg-content">
                <div class="analysis-progress">
                    <div class="text-xs font-bold text-neutral-700 mb-2 flex items-center gap-1.5">
                        <i class="fas fa-cog fa-spin text-primary"></i>
                        sLLM 침해 분석 진행 중
                    </div>
                    ${steps}
                </div>
            </div>`;
        messagesWrapper.appendChild(div);
        scrollToBottom();
        return div;
    }

    function setProgressStep(container, index, state) {
        const step = container.querySelector(`#progressStep${index}`);
        if (!step) return;
        step.classList.remove('active', 'done');
        step.classList.add(state);
        const icon = step.querySelector('.progress-step-icon');
        const span = step.querySelector('span');
        if (state === 'active') {
            icon.innerHTML = '<i class="fas fa-spinner fa-spin" style="font-size:8px;"></i>';
            span.textContent = `${index + 1}번째 특허 구성대비 확인중...`;
        } else if (state === 'done') {
            icon.innerHTML = '<i class="fas fa-check" style="font-size:8px;"></i>';
            span.textContent = `${index + 1}번째 특허 구성대비 완료`;
        }
        scrollToBottom();
    }

    // ==================== 개별 특허 분석 ====================

    function updatePatentButton(index, analysis) {
        const btn = document.querySelector(`.patent-analyze-btn[data-patent-index="${index}"]`);
        if (!btn) return;
        const comps = analysis.comparisons || [];
        const matchCount = comps.filter(c => c.correspondence === '대응').length;
        const total = comps.length;
        const label = analysis.label || '';

        let riskClass = 'risk-low';
        let labelText = '비침해';
        if (label === '침해') { riskClass = 'risk-high'; labelText = '침해'; }
        else if (label === '침해_전문가' || label === '애매') { riskClass = 'risk-medium'; labelText = label === '애매' ? '추가확인' : '전문가검토'; }
        else if (label === '공개') { riskClass = 'risk-info'; labelText = '공개'; }

        btn.disabled = false;
        btn.className = `patent-analyze-btn ${riskClass}`;
        btn.innerHTML = label === '공개' ? '공개 | 권리 미확정' : `${labelText} | 대응 ${matchCount}/${total}`;
    }

    function enableRemainingButtons() {
        document.querySelectorAll('.patent-analyze-btn[disabled]').forEach(btn => {
            btn.disabled = false;
        });
    }

    async function callAnalyzeFromHistoryAPI(analysisId, index) {
        const formData = new FormData();
        formData.append('analysis_id', analysisId);
        formData.append('patent_index', index);
        const resp = await fetch(`${API_BASE}/chat/analyze-from-history`, {
            method: 'POST',
            headers: authHeaders(),
            body: formData,
        });
        if (!resp.ok) {
            const err = await resp.json().catch(() => ({}));
            throw new Error(err.detail || `히스토리 분석 실패: HTTP ${resp.status}`);
        }
        return resp.json();
    }

    async function analyzeSinglePatent(btn, index) {
        // 이미 분석 완료된 항목이면 결과 패널 열기
        const existing = patentAnalyses.find(a => a.patent_index === index);
        if (existing) {
            openResultPanelSingle(existing);
            return;
        }

        // searchToken 없고 currentAnalysisId도 없으면 분석 불가
        if ((!searchToken && !currentAnalysisId) || isAnalyzing) return;

        // 버튼 로딩 상태
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin" style="font-size:7px;"></i> 분석중...';

        try {
            let result;
            if (searchToken) {
                // 현재 세션: 캐시 기반 분석
                result = await callAnalyzePatentAPI(searchToken, index);
            } else {
                // 히스토리 모드: DB 기반 분석
                result = await callAnalyzeFromHistoryAPI(currentAnalysisId, index);
            }
            result.patent_index = index;
            patentAnalyses.push(result);

            // 현재 analysisId에 업데이트
            if (currentAnalysisId) {
                analysesHistory.set(currentAnalysisId, [...patentAnalyses]);
            }

            // 버튼에 판정+대응비율 표시
            updatePatentButton(index, result);

            // 결과 패널에 해당 특허 표시
            openResultPanelSingle(result);
        } catch (e) {
            console.error('개별 분석 실패:', e);
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-microscope" style="font-size:7px;"></i> 재시도';
        }
    }

    // ==================== 결과보기 버튼 ====================

    function addResultViewButton(analyses, analysisId) {
        const div = document.createElement('div');
        div.className = 'msg assistant';

        const labels = analyses.map(a => a.label || '');
        let riskText = '침해 가능성 낮음';
        if (labels.some(l => l === '침해')) riskText = '침해 가능 특허 존재';
        else if (labels.some(l => l === '침해_전문가' || l === '애매')) riskText = '전문가 검토 권장';

        div.innerHTML = `
            <div class="msg-avatar"><i class="fas fa-shield-alt text-xs"></i></div>
            <div class="msg-content">
                <div class="result-ready-banner">
                    <div class="w-10 h-10 rounded-xl flex items-center justify-center flex-shrink-0" style="background: var(--primary-bg); border: 1px solid var(--primary-border);">
                        <i class="fas fa-chart-bar text-primary"></i>
                    </div>
                    <div class="flex-1">
                        <p class="text-sm font-bold text-black mb-0.5">TOP3 침해 분석 완료</p>
                        <p class="text-xs text-neutral-500">${riskText}</p>
                    </div>
                    <button onclick="openResultPanel(${analysisId})" class="result-view-btn">
                        <i class="fas fa-table"></i>
                        TOP3 구성 대비 결과보기
                    </button>
                </div>
            </div>`;
        messagesWrapper.appendChild(div);
        scrollToBottom();
    }

    // ==================== 결과 패널 ====================

    let lastPanelAnalyses = []; // PDF 출력용 현재 패널 데이터

    function openResultPanel(analysisId) {
        const panel = document.getElementById('resultPanel');
        const content = document.getElementById('resultPanelContent');
        const data = analysisId ? (analysesHistory.get(analysisId) || patentAnalyses) : patentAnalyses;
        lastPanelAnalyses = data;
        content.innerHTML = renderResultPanelContent(data);
        document.getElementById('resultPanelTitle').innerHTML = `<i class="fas fa-chart-bar text-primary"></i> TOP${data.length} 구성 대비 결과`;
        panel.classList.add('open');
        document.getElementById('mainContent').classList.add('panel-open');
    }

    function openResultPanelSingle(analysis) {
        const panel = document.getElementById('resultPanel');
        const content = document.getElementById('resultPanelContent');
        lastPanelAnalyses = [analysis];
        content.innerHTML = renderResultPanelContent([analysis]);
        const meta = analysis.metadata || {};
        const title = meta.invention_title || analysis.patent_id || '특허';
        document.getElementById('resultPanelTitle').innerHTML = `<i class="fas fa-chart-bar text-primary"></i> ${escapeHtml(title).substring(0, 20)}...`;
        panel.classList.add('open');
        document.getElementById('mainContent').classList.add('panel-open');
    }

    function closeResultPanel() {
        document.getElementById('resultPanel').classList.remove('open');
        document.getElementById('mainContent').classList.remove('panel-open');
    }

    // ==================== PDF 내보내기 ====================

    function exportResultPDF() {
        const btn = document.querySelector('.pdf-export-btn');
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> PDF 생성 중...';

        const userMsgs = document.querySelectorAll('.msg.user .msg-bubble');
        const userQuery = userMsgs.length > 0 ? userMsgs[userMsgs.length - 1].textContent.trim() : '(질문 없음)';

        const now = new Date();
        const dateStr = `${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
        const fileDate = `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}_${String(now.getHours()).padStart(2,'0')}${String(now.getMinutes()).padStart(2,'0')}`;

        let analyses = lastPanelAnalyses || [];
        if (analyses.length === 0) analyses = patentAnalyses || [];
        if (analyses.length === 0) {
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-file-pdf"></i> PDF로 저장하기';
            alert('분석 결과가 없습니다.');
            return;
        }

        // 새 창에서 깨끗한 HTML로 PDF 생성 (Tailwind CSS 간섭 방지)
        const printWin = window.open('', '_blank', 'width=800,height=600');
        if (!printWin) {
            alert('팝업이 차단되었습니다. 팝업 허용 후 다시 시도해주세요.');
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-file-pdf"></i> PDF로 저장하기';
            return;
        }

        const patentCards = analyses.map((a, i) => {
            const meta = a.metadata || {};
            const title = meta.invention_title || a.patent_id || '특허';
            const applyNum = meta.apply_num || a.patent_id || '';
            const regitNum = meta.regit_num || '';
            const registerStatus = meta.register_status || '';
            const applicant = meta.applicant || '';
            const applicationDate = meta.application_date || '';
            const registerDate = meta.register_date || '';
            const label = a.label || '';
            const labelMap = {
                '침해':       { bg: '#FEE2E2', color: '#DC2626', border: '#FECACA', text: '침해 가능성 높음' },
                '침해_전문가': { bg: '#FEF3C7', color: '#D97706', border: '#FDE68A', text: '전문가 검토 필요' },
                '애매':       { bg: '#FEF3C7', color: '#D97706', border: '#FDE68A', text: '추가 정보 필요' },
                '비침해':     { bg: '#DCFCE7', color: '#16A34A', border: '#BBF7D0', text: '침해 가능성 낮음' },
                '공개':       { bg: '#F3F4F6', color: '#6B7280', border: '#E5E7EB', text: '공개 (권리 미확정)' },
            };
            const ls = labelMap[label] || labelMap['비침해'];
            const comps = a.comparisons || [];
            const matchCount = comps.filter(c => c.correspondence === '대응').length;
            const tableRows = comps.map(c => {
                const corrColor = c.correspondence === '대응' ? '#DC2626' : c.correspondence === '미대응' ? '#2563EB' : '#6B7280';
                const corrBg = c.correspondence === '대응' ? '#FEE2E2' : c.correspondence === '미대응' ? '#DBEAFE' : '#F3F4F6';
                return `<tr>
                    <td style="padding:6px 8px; border-bottom:1px solid #E5E7EB; font-size:11px; line-height:1.4; width:42%;">${escapeHtml(c.patent_element || '-')}</td>

    // 특허 정보 포맷 (PDF + 결과 패널 공용)
    function formatPatentInfo(meta) {
        const applyNum = meta.apply_num || '';
        const rawRegitNum = meta.regit_num || '';
        const regitNum = rawRegitNum.replace(/-0+$/, '');
        const registerStatus = meta.register_status || '';
        const applicant = meta.applicant || '';
        const applicationDate = meta.application_date || '';
        const registerDate = meta.register_date || '';
        const isRegistered = registerStatus === '등록' || !!regitNum;

        const parts = [];
        // 출원번호 (출원일)
        if (applyNum) {
            let s = `출원번호: ${escapeHtml(applyNum)}`;
            if (applicationDate) s += ` (출원일: ${escapeHtml(applicationDate)})`;
            parts.push(s);
        }
        // 등록번호/공개번호 (등록일)
        if (regitNum) {
            const numLabel = isRegistered ? '등록번호' : '공개번호';
            let s = `${numLabel}: ${escapeHtml(regitNum)}`;
            if (registerDate) s += ` (등록일: ${escapeHtml(registerDate)})`;
            parts.push(s);
        }
        // 상태
        if (registerStatus) {
            parts.push(`상태: ${escapeHtml(registerStatus)}`);
        }
        // 특허권자
        if (applicant) {
            parts.push(`특허권자: ${escapeHtml(applicant)}`);
        }
        return parts;
    }

    function formatMessageTime(dateInput) {
        const date = typeof dateInput === 'string' ? new Date(dateInput) : dateInput;

        const ampm = hours >= 12 ? '오후' : '오전';
        const hour12 = hours % 12 || 12;
        return `${ampm} ${hour12}:${minutes}`;
    }

    function startSearchCounter() {
        const counterEl = document.getElementById('searchCounter');
        if (!counterEl) return;
        const total = 80000;
        const startTime = Date.now();
        const duration = 30000; // 최대 30초까지 카운터 진행

        function update() {
            const elapsed = Date.now() - startTime;
            const progress = Math.min(elapsed / duration, 0.99);
            // 처음에 빠르게, 뒤로 갈수록 느리게 (로그 곡선)
            const eased = Math.log(1 + progress * 9) / Math.log(10);
            counterEl.textContent = Math.floor(eased * total).toLocaleString();
            if (progress < 0.99) {
                searchCounterRAF = requestAnimationFrame(update);
            }
        }
        searchCounterRAF = requestAnimationFrame(update);
    }

    function stopSearchCounter() {
        if (searchCounterRAF) {
            cancelAnimationFrame(searchCounterRAF);
            searchCounterRAF = null;
        }
        // 카운터를 최종값으로 설정
        const counterEl = document.getElementById('searchCounter');
        if (counterEl) counterEl.textContent = '80,000';
    }

        if (currentAbortController) {

                        <div class="flex items-center gap-3">
                            <div class="step-num step-3"><span>3</span></div>
                            <span class="text-xs text-neutral-700">구성 대비 결과 확인</span>
                        </div>
                    </div>
                </div>
                <div class="flex justify-center">
                    <button onclick="document.getElementById('messageInput').focus()"
                        class="px-5 py-2.5 bg-primary hover:bg-primary/90 text-white rounded-full font-semibold text-sm transition-all shadow-md hover:shadow-lg flex items-center gap-2">
                        <i class="fas fa-pencil-alt"></i>
                        기술 구성 입력하기
                    </button>
                </div>
            </div>
        `;
        if (typeof Toast !== 'undefined') Toast.success('새 분석을 시작합니다.');
    }

    // ==================== 유틸 ====================

    function setStatus(text) {
        document.getElementById('sessionStatus').textContent = text;
    }

    function updateTotalCount() {
        document.getElementById('totalCount').textContent = sessionCount;
    }

    function scrollToBottom() {
        const area = document.getElementById('messagesArea');
        area.scrollTop = area.scrollHeight;
    }

    function escapeHtml(str) {
        if (typeof str !== 'string') return String(str ?? '');
        return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // ==================== 채팅 세션 로드 ====================

    async function loadChatSessions() {
        try {
            const response = await fetch(`${API_BASE}/chat`, {
                headers: authHeaders(),
            });
            if (!response.ok) return;

            const sessions = await response.json();
            sessionCount = sessions.length;
            updateTotalCount();

            const container = document.getElementById('chatSessions');
            if (sessions.length === 0) return;
            // 빈 상태 placeholder 제거
            const placeholder = container.querySelector('.text-center');
            if (placeholder) placeholder.remove();

            // 세션 카드 렌더링
            sessions.forEach((session, idx) => {
                const card = document.createElement('div');
                card.className = 'session-card' + (idx === 0 ? ' active' : '');
                card.dataset.chatId = session.id;
                const timeAgo = formatTimeAgo(session.created_at);
                card.innerHTML = `
                    <div class="flex items-center justify-between mb-2">
                        <span class="type-badge"><i class="fas fa-file-alt mr-1"></i>특허·실용신안</span>
                        <div class="flex items-center gap-2">
                            <span class="text-xs text-neutral-500">${timeAgo}</span>
                            <button class="delete-btn icon-btn" data-chat-id="${session.id}" title="삭제" style="width:1.5rem;height:1.5rem;">
                                <i class="fas fa-times text-xs"></i>
                            </button>
                        </div>
                    </div>
                    <h4 class="text-sm font-semibold text-black leading-snug" style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;">
                        ${escapeHtml(session.title || '새 대화')}
                    </h4>
                `;
                // 카드 클릭 시 채팅 로드 (삭제 버튼 제외)
                card.onclick = (e) => {
                    if (!e.target.closest('.delete-btn')) {
                        loadChatHistory(session.id);
                    }
                };
                // 삭제 버튼 클릭
                card.querySelector('.delete-btn').onclick = (e) => {
                    e.stopPropagation();
                    deleteChat(session.id, card);
                };
                container.appendChild(card);
            });
        } catch (error) {
            console.error('세션 로드 실패:', error);
        }
    }

    async function deleteChat(chatId, cardElement) {
        if (!confirm('이 대화를 삭제할까요?')) return;
        try {
            const resp = await fetch(`${API_BASE}/chat/${chatId}`, {
                method: 'DELETE',
                headers: authHeaders(),
            });
            if (resp.ok) {
                cardElement.remove();
                sessionCount--;
                updateTotalCount();
                if (threadId == chatId) startNewChat();
            }
        } catch (e) {
            console.error('삭제 실패:', e);
        }
    }

    async function loadChatHistory(chatId) {
        try {
            const response = await fetch(`${API_BASE}/chat/${chatId}`, {
                headers: authHeaders(),
            });
            if (!response.ok) return;

            const chat = await response.json();
            threadId = chatId;

            // 활성 세션 표시
            document.querySelectorAll('.session-card').forEach(c => {
                c.classList.toggle('active', c.dataset.chatId == chatId);
            });

            // 메시지 영역 초기화
            if (welcomeMessage) welcomeMessage.remove();
            messagesWrapper.innerHTML = '';
            closeResultPanel();

            // 메시지 렌더링 + 분석 결과 복원
            const analysisIds = [];
            if (chat.messages && chat.messages.length > 0) {
                chat.messages.forEach(msg => {
                    if (msg.role === 'user') {
                        addUserMessage(msg.content, msg.created_at);
                    } else if (msg.role === 'assistant') {
                        addBotMessage(msg.content, msg.created_at);
                    }
                    // analysis는 user 메시지에 연결되어 있음
                    if (msg.analysis_id) {
                        analysisIds.push(msg.analysis_id);
                    }
                });
            }

            // 분석 결과가 있으면 복원 (TOP10 리스트 + 결과보기 버튼)
            // 히스토리 모드 초기화
            searchToken = null;
            currentAnalysisId = null;
            patentAnalyses = [];
            searchResults = [];

            for (const aid of analysisIds) {
                try {
                    const aResp = await fetch(`${API_BASE}/chat/analysis/${aid}`, {
                        headers: authHeaders(),
                    });
                    if (aResp.ok) {
                        const aData = await aResp.json();
                        const sResults = aData.search_results || [];
                        const analyses = aData.patent_analyses || [];

                        // TOP10 리스트 복원
                        if (sResults.length > 0) {
                            addPatentListMessage(sResults);
                            searchResults = sResults;
                            currentAnalysisId = aid;

                            // 분석 완료된 특허 버튼 업데이트
                            analyses.forEach(a => {
                                if (a.patent_index !== undefined) {
                                    updatePatentButton(a.patent_index, a);
                                }
                            });

                            // 미분석 버튼 활성화 (히스토리에서도 분석 가능하게)
                            enableRemainingButtons();
                        }

                        if (analyses.length > 0) {
                            patentAnalyses = analyses;
                            analysesHistory.set(aid, analyses);
                            addResultViewButton(analyses, aid);
                        }
                    }
                } catch (e) {
                    console.error('분석 결과 로드 실패:', e);
                }
            }

            setStatus('대화 중');
        } catch (error) {
            console.error('채팅 히스토리 로드 실패:', error);
        }
    }

    function formatTimeAgo(dateStr) {
        if (!dateStr) return '';
        const date = new Date(dateStr);
        const now = new Date();
        const diff = Math.floor((now - date) / 1000);

        if (diff < 60) return '방금';
        if (diff < 3600) return `${Math.floor(diff / 60)}분 전`;
        if (diff < 86400) return `${Math.floor(diff / 3600)}시간 전`;
        if (diff < 604800) return `${Math.floor(diff / 86400)}일 전`;
        return date.toLocaleDateString('ko-KR');
    }

    // 페이지 로드 시 세션 목록 불러오기
    document.addEventListener('DOMContentLoaded', () => {
        loadChatSessions();
    });

    // ==================== 사이드바 토글 ====================

    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        const mainContent = document.getElementById('mainContent');
        const toggleIcon = document.getElementById('toggleIcon');
        const openBtn = document.getElementById('sidebarOpenBtn');
        const backdrop = document.getElementById('sidebarBackdrop');
        const isMobile = window.innerWidth < 1024;

        if (isMobile) {
            // 모바일: 오버레이 모드 (margin 변경 없음)
            sidebar.classList.toggle('sidebar-open');
            const isOpen = sidebar.classList.contains('sidebar-open');
            if (backdrop) backdrop.classList.toggle('active', isOpen);
        } else {
            // 데스크톱: 기존 margin 기반 토글
            sidebar.classList.toggle('sidebar-hidden');

            if (sidebar.classList.contains('sidebar-hidden')) {
                mainContent.style.marginLeft = '0';
                toggleIcon.classList.replace('fa-chevron-left', 'fa-chevron-right');
                openBtn.classList.add('visible');
            } else {
                mainContent.style.marginLeft = '18rem';
                toggleIcon.classList.replace('fa-chevron-right', 'fa-chevron-left');
                openBtn.classList.remove('visible');
            }
        }
    }
    </script>
