<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- Toast System -->
    <link rel="stylesheet" href="toast.css">

    <title>특허·실용신안 리스크 분석 AI - FTOGuard</title>

    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css');

        * {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        :root {
            --primary: #FF6B35;
            --primary-dark: #E55A2B;
            --primary-light: #FF8C5A;
            --primary-bg: rgba(255, 107, 53, 0.06);
            --primary-bg-hover: rgba(255, 107, 53, 0.10);
            --primary-border: rgba(255, 107, 53, 0.18);
        }

        .text-primary { color: var(--primary); }
        .bg-primary { background-color: var(--primary); }
        .border-primary { border-color: var(--primary); }
        .hover\:bg-primary\/90:hover { background-color: rgba(255, 107, 53, 0.9); }

        /* 사이드바 */
        #sidebar {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        #sidebar.sidebar-hidden {
            transform: translateX(-100%);
        }
        #sidebarOpenBtn {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease 0.15s;
        }
        #sidebarOpenBtn.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .icon-btn {
            width: 2rem;
            height: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #A3A3A3;
            border-radius: 0.5rem;
            transition: all 0.15s ease;
            background: transparent;
            border: none;
            cursor: pointer;
        }
        .icon-btn:hover {
            color: var(--primary);
            background: var(--primary-bg);
        }

        /* Session Card */
        .session-card {
            background: white;
            border: 1px solid #E5E5E5;
            border-radius: 1rem;
            padding: 1.25rem;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 0.75rem;
        }
        .session-card:hover {
            border-color: var(--primary);
            box-shadow: 0 4px 16px rgba(255, 107, 53, 0.08);
            transform: translateY(-2px);
        }
        .session-card.active {
            background: #FFF5F0;
            border-color: var(--primary);
            box-shadow: 0 4px 16px rgba(255, 107, 53, 0.12);
        }

        /* 스크롤바 */
        #chatSessions::-webkit-scrollbar { width: 6px; }
        #chatSessions::-webkit-scrollbar-track { background: transparent; }
        #chatSessions::-webkit-scrollbar-thumb { background: #D4D4D4; border-radius: 3px; }
        #chatSessions::-webkit-scrollbar-thumb:hover { background: var(--primary); }

        #messagesArea::-webkit-scrollbar { width: 6px; }
        #messagesArea::-webkit-scrollbar-track { background: transparent; }
        #messagesArea::-webkit-scrollbar-thumb { background: #D4D4D4; border-radius: 3px; }
        #messagesArea::-webkit-scrollbar-thumb:hover { background: var(--primary); }

        .type-badge {
            font-size: 0.7rem;
            font-weight: 600;
            padding: 0.2rem 0.5rem;
            border-radius: 0.5rem;
            border: 1px solid var(--primary-border);
            background: var(--primary-bg);
            color: var(--primary);
            white-space: nowrap;
        }

        /* 메시지 스타일 */
        .msg { display: flex; gap: 0.75rem; margin-bottom: 1.25rem; }
        .msg.user { flex-direction: row-reverse; }

        .msg-avatar {
            width: 2.25rem;
            height: 2.25rem;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 0.8rem;
        }
        .msg.assistant .msg-avatar {
            background: var(--primary);
            color: white;
        }
        .msg.user .msg-avatar {
            background: #10B981;
            color: white;
        }

        .msg-content { flex: 1; max-width: 80%; }
        .msg.user .msg-content {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .msg-bubble {
            padding: 0.875rem 1.125rem;
            border-radius: 1rem;
            line-height: 1.65;
            font-size: 0.9rem;
        }
        .msg.assistant .msg-bubble {
            background: white;
            border: 1px solid #E5E5E5;
            border-top-left-radius: 0.25rem;
        }
        .msg.user .msg-bubble {
            background: var(--primary);
            color: white;
            border-top-right-radius: 0.25rem;
        }

        /* 타이핑 인디케이터 */
        .typing-indicator { display: flex; gap: 0.25rem; padding: 0.75rem; }
        .typing-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: #A3A3A3;
            animation: typing 1.4s infinite;
        }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.7; }
            30% { transform: translateY(-10px); opacity: 1; }
        }

        /* 리포트 박스 */
        .report-box {
            white-space: pre-wrap;
            font-size: 0.9rem;
            line-height: 1.7;
            background: #FFF7F2;
            padding: 1rem;
            border-radius: 0.75rem;
            border-left: 4px solid var(--primary);
        }

        /* 결과 이동 배너 */
        .result-ready-banner {
            background: linear-gradient(135deg, #FFF5F0, #FFF0E8);
            border: 1.5px solid var(--primary-border);
            border-radius: 1rem;
            padding: 1rem 1.25rem;
            margin-top: 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        /* 스텝 넘버 */
        .step-num {
            width: 1.5rem;
            height: 1.5rem;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 1px 3px rgba(255, 107, 53, 0.15);
            color: white;
            font-size: 0.65rem;
            font-weight: 700;
        }
        .step-num.step-1 { background: var(--primary); }
        .step-num.step-2 { background: var(--primary-light); }
        .step-num.step-3 { background: var(--primary-dark); }

        /* ===== TOP 10 특허 리스트 ===== */
        .patent-list-card {
            background: white;
            border: 1px solid #E5E5E5;
            border-radius: 1rem;
            overflow: hidden;
        }
        .patent-list-header {
            padding: 0.875rem 1.25rem;
            background: linear-gradient(135deg, var(--primary-bg), rgba(255, 140, 90, 0.04));
            border-bottom: 1px solid var(--primary-border);
        }
        .patent-list-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.625rem 1.25rem;
            border-bottom: 1px solid #F5F5F5;
            font-size: 0.8rem;
            transition: background 0.15s;
        }
        .patent-list-item:hover { background: #FAFAFA; }
        .patent-list-item:last-child { border-bottom: none; }
        .patent-rank-badge {
            width: 1.5rem; height: 1.5rem;
            border-radius: 0.375rem;
            background: rgba(255,107,53,0.08);
            color: var(--primary);
            font-size: 0.65rem; font-weight: 800;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .patent-status-badge {
            font-size: 0.6rem; font-weight: 600;
            padding: 0.1rem 0.35rem; border-radius: 0.25rem;
        }
        .patent-status-badge.registered { background: #DCFCE7; color: #16A34A; }
        .patent-status-badge.published { background: #DBEAFE; color: #2563EB; }

        /* ===== 분석 프로그레스 ===== */
        .analysis-progress {
            background: white;
            border: 1px solid #E5E5E5;
            border-radius: 1rem;
            padding: 1rem 1.25rem;
        }
        .progress-step-chat {
            display: flex; align-items: center; gap: 0.75rem;
            padding: 0.5rem 0;
            font-size: 0.8rem; color: #A3A3A3;
            transition: color 0.3s;
        }
        .progress-step-chat.active { color: #171717; }
        .progress-step-chat.done { color: #16A34A; }
        .progress-step-icon {
            width: 1.5rem; height: 1.5rem; border-radius: 50%;
            border: 2px solid #E5E5E5;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.6rem; flex-shrink: 0;
            transition: all 0.3s;
        }
        .progress-step-chat.active .progress-step-icon {
            border-color: var(--primary); color: var(--primary);
            background: rgba(255,107,53,0.08);
            animation: stepPulse 1s ease-in-out infinite;
        }
        .progress-step-chat.done .progress-step-icon {
            border-color: #16A34A; color: white; background: #16A34A;
        }
        @keyframes stepPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255,107,53,0.3); }
            50% { box-shadow: 0 0 0 4px rgba(255,107,53,0); }
        }

        /* ===== 오른쪽 결과 패널 ===== */
        #resultPanel {
            position: fixed;
            top: 80px;
            right: 0;
            bottom: 0;
            width: 55%;
            max-width: 720px;
            background: white;
            border-left: 1px solid #E5E5E5;
            box-shadow: -4px 0 24px rgba(0,0,0,0.08);
            z-index: 50;
            transform: translateX(100%);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-y: auto;
        }
        #resultPanel.open { transform: translateX(0); }
        #resultPanel::-webkit-scrollbar { width: 6px; }
        #resultPanel::-webkit-scrollbar-track { background: transparent; }
        #resultPanel::-webkit-scrollbar-thumb { background: #D4D4D4; border-radius: 3px; }

        #mainContent.panel-open {
            margin-right: 55%;
            transition: margin-right 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* 결과보기 버튼 */
        .result-view-btn {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            padding: 0.625rem 1.25rem;
            border-radius: 0.75rem;
            font-weight: 700;
            font-size: 0.8rem;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(255, 107, 53, 0.3);
            white-space: nowrap;
        }
        .result-view-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(255, 107, 53, 0.4);
        }

        /* 패널 내부 카드 */
        .panel-patent-card {
            border: 1px solid #E5E5E5;
            border-radius: 0.75rem;
            padding: 1.25rem;
            margin-bottom: 1.25rem;
            background: #FAFAFA;
        }
        .panel-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
        }
        .panel-table th {
            background: #F5F5F5;
            font-weight: 700;
            text-align: left;
            padding: 0.5rem 0.75rem;
            border-bottom: 2px solid #E5E5E5;
            font-size: 0.75rem;
            color: #525252;
        }
        .panel-table td {
            padding: 0.5rem 0.75rem;
            border-bottom: 1px solid #F0F0F0;
            vertical-align: top;
            line-height: 1.5;
        }
        .corr-badge {
            display: inline-block;
            padding: 0.15rem 0.4rem;
            border-radius: 0.25rem;
            font-size: 0.7rem;
            font-weight: 600;
        }
        .corr-badge.match { background: #FEE2E2; color: #DC2626; }
        .corr-badge.no-match { background: #DBEAFE; color: #2563EB; }
        .corr-badge.unknown { background: #F5F5F5; color: #737373; }
    </style>
</head>

<body style="background-color: #FFF7F2;">

    <!-- 사이드바 열기 버튼 -->

    <div class="flex h-screen">

        <aside id="sidebar" class="w-72 bg-white border-r border-neutral-200 flex flex-col hidden lg:flex fixed left-0 top-20 bottom-0 z-40">
            <!-- Header -->
            <div class="p-6 border-b border-neutral-200">
                <div class="flex items-center justify-between mb-5">

                            <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl mb-4" style="background: rgba(255, 107, 53, 0.10);">

    <script src="script.js"></script>

    <script>
    // ==================== 설정 ====================
    const API_BASE = '/api';

    // ==================== 상태 ====================
    let threadId = null;
    let sessionCount = 0;
    let isAnalyzing = false;
    let currentAbortController = null;
    let searchToken = null;
    let searchResults = null;
    let patentAnalyses = [];
    let currentAnalysisId = null;
    const analysesHistory = new Map(); // analysisId → patentAnalyses 보존

    // ==================== DOM ====================
    const messagesWrapper = document.getElementById('messagesWrapper');
    const messageInput    = document.getElementById('messageInput');
    const sendBtn         = document.getElementById('sendBtn');
    const welcomeMessage  = document.getElementById('welcomeMessage');

    // ==================== 이벤트 ====================
    messageInput.addEventListener('input', () => {
        updateSendButton();
        autoResize();
    });

    messageInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            if (!sendBtn.disabled) handleSend();
        }
    });

    sendBtn.addEventListener('click', handleSend);

    function autoResize() {
        messageInput.style.height = 'auto';
        messageInput.style.height = Math.min(messageInput.scrollHeight, 120) + 'px';
    }

    function updateSendButton() {
        sendBtn.disabled = isAnalyzing || !messageInput.value.trim();
    }

    function fillQuery(text) {
        messageInput.value = text;
        autoResize();
        updateSendButton();
        messageInput.focus();
    }

    // ==================== API 호출 ====================

    function authHeaders() {
        const token = localStorage.getItem('authToken') || '';
        return token ? { 'Authorization': `Bearer ${token}` } : {};
    }

    async function callSearchAPI(message) {
        const formData = new FormData();
        formData.append('message', message);
        if (threadId) formData.append('session_id', threadId);
        const resp = await fetch(`${API_BASE}/chat/search`, {
            method: 'POST',
            headers: authHeaders(),
            body: formData,
        });
        if (!resp.ok) {
            const err = await resp.json().catch(() => ({}));
            throw new Error(err.detail || `검색 실패: HTTP ${resp.status}`);
        }
        return resp.json();
    }

    async function callAnalyzePatentAPI(token, index) {
        const formData = new FormData();
        formData.append('search_token', token);
        formData.append('patent_index', index);
        const resp = await fetch(`${API_BASE}/chat/analyze-patent`, {
            method: 'POST',
            headers: authHeaders(),
            body: formData,
        });
        if (!resp.ok) {
            const err = await resp.json().catch(() => ({}));
            throw new Error(err.detail || `분석 실패: HTTP ${resp.status}`);
        }
        return resp.json();
    }

    async function callFinalizeAPI(token, analyses) {
        const formData = new FormData();
        formData.append('search_token', token);
        formData.append('patent_analyses_json', JSON.stringify(analyses));
        const resp = await fetch(`${API_BASE}/chat/finalize`, {
            method: 'POST',
            headers: authHeaders(),
            body: formData,
        });
        if (!resp.ok) {
            const err = await resp.json().catch(() => ({}));
            throw new Error(err.detail || `저장 실패: HTTP ${resp.status}`);
        }
        return resp.json();
    }

    // ==================== 메인 전송 (3단계) ====================

    async function handleSend() {
        const text = messageInput.value.trim();
        if (!text || isAnalyzing) return;

        if (welcomeMessage) welcomeMessage.remove();

        addUserMessage(text);
        messageInput.value = '';
        messageInput.style.height = 'auto';
        isAnalyzing = true;
        updateSendButton();

        try {
            // ── Phase 1: 검색 ──
            setStatus('검색 중');
            addLoadingMessage('유사 특허 검색 중...');

            const searchResp = await callSearchAPI(text);

            removeLoadingMessage();
            threadId = searchResp.session_id;
            searchToken = searchResp.search_token;
            searchResults = searchResp.search_results;

            addPatentListMessage(searchResults);

            // ── Phase 2: TOP 3 분석 ──
            setStatus('분석 중');
            const analyzeCount = Math.min(3, searchResults.length);
            const progressEl = addAnalysisProgress(analyzeCount);
            patentAnalyses = [];

            for (let i = 0; i < analyzeCount; i++) {
                setProgressStep(progressEl, i, 'active');
                const result = await callAnalyzePatentAPI(searchToken, i);
                patentAnalyses.push(result);
                setProgressStep(progressEl, i, 'done');
            }

            // ── Phase 3: 저장 ──
            const finalResp = await callFinalizeAPI(searchToken, patentAnalyses);
            currentAnalysisId = finalResp.analysis_id;

            // 분석 결과를 ID별로 보존 (덮어쓰기 방지)
            analysesHistory.set(currentAnalysisId, [...patentAnalyses]);

            addResultViewButton(patentAnalyses, currentAnalysisId);

            sessionCount++;
            updateTotalCount();
            addSessionCard(text, currentAnalysisId);
            setStatus('완료');

        } catch (error) {
            if (error.name === 'AbortError') return;
            removeLoadingMessage();
            addBotMessage(`분석 오류: ${error.message}`);
            setStatus('오류');
        } finally {
            isAnalyzing = false;
            updateSendButton();
        }
    }

    function setProgressStep(container, index, state) {
        const step = container.querySelector(`#progressStep${index}`);
        if (!step) return;
        step.classList.remove('active', 'done');
        step.classList.add(state);
        const icon = step.querySelector('.progress-step-icon');
        const span = step.querySelector('span');
        if (state === 'active') {
            icon.innerHTML = '<i class="fas fa-spinner fa-spin" style="font-size:8px;"></i>';
            span.textContent = `${index + 1}번째 특허 구성대비 확인중...`;
        } else if (state === 'done') {
            icon.innerHTML = '<i class="fas fa-check" style="font-size:8px;"></i>';
            span.textContent = `${index + 1}번째 특허 구성대비 완료`;
        }
        scrollToBottom();
    }

        if (!value) return 'unknown';

        return 'unknown'; // 확인불가 등
    }

    function renderResultPanelContent(analyses) {
        return analyses.map((a, i) => {

            };
            const ls = labelStyles[a.label] || labelStyles['비침해'];

            // 구성 대비 테이블
            const compRows = (a.comparisons || []).map(c => {
                const cls = corrBadgeClass(c.correspondence);
                return `<tr>
                    <td>${escapeHtml(c.patent_element || '-')}</td>

                        <span class="text-xs font-semibold" style="${ls.color}">${ls.text}</span>

                    <!-- 구성 대비 테이블 -->

                        <table class="panel-table">

                                <tr>

                                </tr>
                            </thead>

                        </table>

                    <!-- 판단 -->
                    ${a.analysis_text ? `

    function addUserMessage(text, timestamp = null) {
        const div = document.createElement('div');
        div.className = 'msg user';

        div.innerHTML = `

    function addBotMessage(text, timestamp = null) {
        const div = document.createElement('div');
        div.className = 'msg assistant';
        const formatted = escapeHtml(text).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
        const timeStr = timestamp ? formatMessageTime(timestamp) : formatMessageTime(new Date());
        div.innerHTML = `
            <div class="msg-avatar"><i class="fas fa-shield-alt text-xs"></i></div>
            <div class="msg-content">
                <div class="msg-bubble" style="white-space:pre-wrap;">${formatted}</div>
                <div class="text-xs text-neutral-400 mt-1">${timeStr}</div>
            </div>
        `;
        messagesWrapper.appendChild(div);
        scrollToBottom();
    }

    function formatMessageTime(dateInput) {
        const date = typeof dateInput === 'string' ? new Date(dateInput) : dateInput;
        const hours = date.getHours();
        const minutes = date.getMinutes().toString().padStart(2, '0');
        const ampm = hours >= 12 ? '오후' : '오전';
        const hour12 = hours % 12 || 12;
        return `${ampm} ${hour12}:${minutes}`;
    }

    function setStatus(text) {

    function escapeHtml(str) {
        if (typeof str !== 'string') return String(str ?? '');
        return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // ==================== 채팅 세션 로드 ====================

    async function loadChatSessions() {
        try {
            const response = await fetch(`${API_BASE}/chat`, {
                headers: authHeaders(),
            });
            if (!response.ok) return;

            const sessions = await response.json();
            sessionCount = sessions.length;
            updateTotalCount();

            const container = document.getElementById('chatSessions');
            if (sessions.length === 0) return;
            // 빈 상태 placeholder 제거
            const placeholder = container.querySelector('.text-center');
            if (placeholder) placeholder.remove();

            // 세션 카드 렌더링
            sessions.forEach((session, idx) => {
                const card = document.createElement('div');
                card.className = 'session-card' + (idx === 0 ? ' active' : '');
                card.dataset.chatId = session.id;
                const timeAgo = formatTimeAgo(session.created_at);
                card.innerHTML = `
                    <div class="flex items-center justify-between mb-2">
                        <span class="type-badge"><i class="fas fa-file-alt mr-1"></i>특허·실용신안</span>
                        <div class="flex items-center gap-2">
                            <span class="text-xs text-neutral-500">${timeAgo}</span>
                            <button class="delete-btn icon-btn" data-chat-id="${session.id}" title="삭제" style="width:1.5rem;height:1.5rem;">
                                <i class="fas fa-times text-xs"></i>
                            </button>
                        </div>
                    </div>
                    <h4 class="text-sm font-semibold text-black leading-snug" style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;">
                        ${escapeHtml(session.title || '새 대화')}
                    </h4>
                `;
                // 카드 클릭 시 채팅 로드 (삭제 버튼 제외)
                card.onclick = (e) => {
                    if (!e.target.closest('.delete-btn')) {
                        loadChatHistory(session.id);
                    }
                };
                // 삭제 버튼 클릭
                card.querySelector('.delete-btn').onclick = (e) => {
                    e.stopPropagation();
                    deleteChat(session.id, card);
                };
                container.appendChild(card);
            });
        } catch (error) {
            console.error('세션 로드 실패:', error);
        }
    }

    async function loadChatHistory(chatId) {
        try {
            const response = await fetch(`${API_BASE}/chat/${chatId}`, {
                headers: authHeaders(),
            });
            if (!response.ok) return;

            const chat = await response.json();
            threadId = chatId;

            // 활성 세션 표시
            document.querySelectorAll('.session-card').forEach(c => {
                c.classList.toggle('active', c.dataset.chatId == chatId);
            });

            // 메시지 영역 초기화
            if (welcomeMessage) welcomeMessage.remove();
            messagesWrapper.innerHTML = '';

            // 메시지 렌더링 (시간 포함)
            if (chat.messages && chat.messages.length > 0) {
                chat.messages.forEach(msg => {
                    if (msg.role === 'user') {
                        addUserMessage(msg.content, msg.created_at);
                    } else if (msg.role === 'assistant') {
                        addBotMessage(msg.content, msg.created_at);
                    }
                });
            }

            setStatus('대화 중');
        } catch (error) {
            console.error('채팅 히스토리 로드 실패:', error);
        }
    }

    function formatTimeAgo(dateStr) {
        if (!dateStr) return '';
        const date = new Date(dateStr);
        const now = new Date();
        const diff = Math.floor((now - date) / 1000);

        if (diff < 60) return '방금';
        if (diff < 3600) return `${Math.floor(diff / 60)}분 전`;
        if (diff < 86400) return `${Math.floor(diff / 3600)}시간 전`;
        if (diff < 604800) return `${Math.floor(diff / 86400)}일 전`;
        return date.toLocaleDateString('ko-KR');
    }

    // 페이지 로드 시 세션 목록 불러오기
    document.addEventListener('DOMContentLoaded', () => {
        loadChatSessions();
    });

    // ==================== 사이드바 토글 ====================

    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        const mainContent = document.getElementById('mainContent');
        const toggleIcon = document.getElementById('toggleIcon');
        const openBtn = document.getElementById('sidebarOpenBtn');

        sidebar.classList.toggle('sidebar-hidden');

        if (sidebar.classList.contains('sidebar-hidden')) {
            mainContent.style.marginLeft = '0';
            toggleIcon.classList.replace('fa-chevron-left', 'fa-chevron-right');
            openBtn.classList.add('visible');
        } else {
            mainContent.style.marginLeft = '18rem';
            toggleIcon.classList.replace('fa-chevron-right', 'fa-chevron-left');
            openBtn.classList.remove('visible');
        }
    }
    </script>
</body>
