<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- Toast System -->
    <link rel="stylesheet" href="toast.css">

    <title>AI 분석 - FTOGuard</title>

    <style>
        /* Pretendard 폰트 */
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css');

        * {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        :root {
            --primary: #FF6B35;
            --primary-dark: #E55A2B;
            --primary-light: #FF8C5A;
            --primary-bg: rgba(255, 107, 53, 0.06);
            --primary-bg-hover: rgba(255, 107, 53, 0.10);
            --primary-border: rgba(255, 107, 53, 0.18);
        }

        .text-primary { color: var(--primary); }
        .bg-primary { background-color: var(--primary); }
        .border-primary { border-color: var(--primary); }
        .hover\:bg-primary\/90:hover { background-color: rgba(255, 107, 53, 0.9); }

        /* 사이드바 애니메이션 */
        #sidebar {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #sidebar.sidebar-hidden {
            transform: translateX(-100%);
        }

        /* 사이드바 열기 버튼 (숨긴 상태에서만 표시) */
        #sidebarOpenBtn {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease 0.15s;
        }

        #sidebarOpenBtn.visible {
            opacity: 1;
            pointer-events: auto;
        }

        /* 통일 아이콘 버튼 스타일 */
        .icon-btn {
            width: 2rem;
            height: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #A3A3A3;
            border-radius: 0.5rem;
            transition: all 0.15s ease;
            background: transparent;
            border: none;
            cursor: pointer;
        }

        .icon-btn:hover {
            color: var(--primary);
            background: var(--primary-bg);
        }

        /* Session Card */
        .session-card {
            background: white;
            border: 1px solid #E5E5E5;
            border-radius: 1rem;
            padding: 1.25rem;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 0.75rem;
        }

        .session-card:hover {
            border-color: var(--primary);
            box-shadow: 0 4px 16px rgba(255, 107, 53, 0.08);
            transform: translateY(-2px);
        }

        .session-card.active {
            background: #FFF5F0;
            border-color: var(--primary);
            box-shadow: 0 4px 16px rgba(255, 107, 53, 0.12);
        }

        /* 스크롤바 */
        #chatSessions::-webkit-scrollbar {
            width: 6px;
        }

        #chatSessions::-webkit-scrollbar-track {
            background: transparent;
        }

        #chatSessions::-webkit-scrollbar-thumb {
            background: #D4D4D4;
            border-radius: 3px;
        }

        #chatSessions::-webkit-scrollbar-thumb:hover {
            background: var(--primary);
        }

        /* 세션 타입 뱃지 (primary 톤 통일) */
        .type-badge {
            font-size: 0.7rem;
            font-weight: 600;
            padding: 0.2rem 0.5rem;
            border-radius: 0.5rem;
            border: 1px solid var(--primary-border);
            background: var(--primary-bg);
            color: var(--primary);
            white-space: nowrap;
        }

        .type-badge.tone-mid {
            background: rgba(255, 107, 53, 0.10);
            border-color: rgba(255, 107, 53, 0.25);
            color: var(--primary-dark);
        }

        .type-badge.tone-deep {
            background: rgba(255, 107, 53, 0.15);
            border-color: rgba(255, 107, 53, 0.30);
            color: #CC4A1A;
        }

        /* 스텝 넘버링 - primary 톤 그라데이션 */
        .step-num {
            width: 1.5rem;
            height: 1.5rem;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 1px 3px rgba(255, 107, 53, 0.15);
        }

        .step-num span {
            color: white;
            font-size: 0.65rem;
            font-weight: 700;
        }

        .step-num.step-1 { background: var(--primary); }
        .step-num.step-2 { background: var(--primary-light); }
        .step-num.step-3 { background: var(--primary-dark); }
        .step-num.step-4 { background: #C2410C; } /* Purple for design step 4 */

        /* ── 첨부 기능 ────────────────────────────────────────── */

        /* 클립(첨부) 버튼 */
        .attach-btn {
            width: 2.75rem;
            height: 2.75rem;
            flex-shrink: 0;
            display: flex !important;
            align-items: center;
            justify-content: center;
            border: 1px solid #D4D4D4;
            border-radius: 0.75rem;
            background: white;
            color: #737373;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .attach-btn:hover {
            color: var(--primary);
            border-color: var(--primary);
            background: var(--primary-bg);
        }

        .attach-btn.has-files {
            color: var(--primary);
            background: var(--primary-bg);
            border-color: var(--primary);
        }

        /* 이미지 프리뷰 영역 */
        .image-preview-area {
            margin-bottom: 0.625rem;
            padding: 0.625rem 0.75rem;
            background: var(--primary-bg);
            border: 1px solid var(--primary-border);
            border-radius: 0.75rem;
        }

        .image-preview-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        /* 개별 썸네일 */
        .image-preview-item {
            position: relative;
            width: 3.5rem;
            height: 3.5rem;
            border-radius: 0.5rem;
            overflow: visible;
            border: 1px solid var(--primary-border);
            flex-shrink: 0;
        }

        .image-preview-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 0.5rem;
            display: block;
        }

        /* 삭제(×) 버튼 */
        .image-preview-item .remove-btn {
            position: absolute;
            top: -0.35rem;
            right: -0.35rem;
            width: 1.25rem;
            height: 1.25rem;
            background: var(--primary);
            color: white;
            border: 2px solid white;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.55rem;
            padding: 0;
            line-height: 1;
            transition: background 0.15s ease;
            z-index: 1;
        }

        .image-preview-item .remove-btn:hover {
            background: var(--primary-dark);
        }
    </style>
</head>

<body style="background-color: #FFF7F2;">
    <!-- 공통 헤더 -->
    <div id="app-header"></div>

    <!-- 사이드바 열기 버튼 (사이드바 숨겼을 때만 표시) -->
    <button
        id="sidebarOpenBtn"
        onclick="toggleSidebar()"
        class="fixed left-3 top-24 z-50 icon-btn bg-white border border-neutral-200 shadow-md"
        title="사이드바 열기"
        style="width: 2rem; height: 2rem;"
    >
        <i class="fas fa-chevron-right text-xs"></i>
    </button>

    <div class="flex h-screen">
        <!-- 사이드바 - 토글 버튼 내부 통합 -->
        <aside id="sidebar" class="w-72 bg-white border-r border-neutral-200 flex flex-col hidden lg:flex fixed left-0 top-20 bottom-0 z-40">
            <!-- Header with Toggle -->
            <div class="p-6 border-b border-neutral-200">
                <div class="flex items-center justify-between mb-5">
                    <h3 class="text-neutral-900 text-sm font-bold">특허·실용신안 분석 기록</h3>
                    <div class="flex items-center gap-2">
                        <button
                            onclick="startNewAnalysis()"
                            class="icon-btn"
                            title="새 분석"
                        >
                            <i class="fas fa-plus text-xs"></i>
                        </button>
                        <button
                            onclick="toggleSidebar()"
                            class="icon-btn"
                            title="사이드바 접기"
                            id="toggleSidebarBtn"
                        >
                            <i class="fas fa-chevron-left text-xs" id="toggleIcon"></i>
                        </button>
                    </div>
                </div>

                <!-- Stats -->
                <div class="grid grid-cols-2 gap-3">
                    <div class="bg-neutral-50 rounded-xl p-4 border border-neutral-200">
                        <div class="text-2xl font-bold text-black" id="totalAnalysisCount">0</div>
                        <div class="text-xs text-neutral-600 mt-1">Total</div>
                    </div>
                    <div class="rounded-xl p-4 border" style="background: var(--primary-bg); border-color: var(--primary-border);">
                        <div class="text-2xl font-bold text-primary" id="sessionStatus">대기</div>
                        <div class="text-xs text-neutral-600 mt-1">상태</div>
                    </div>
                </div>
            </div>

            <!-- Analysis List -->
            <div class="flex-1 overflow-y-auto p-4" id="chatSessions">
                <div class="text-center py-8">
                    <div class="w-14 h-14 bg-neutral-50 rounded-2xl flex items-center justify-center mx-auto mb-3 border border-neutral-200">
                        <i class="fas fa-file-alt text-xl text-neutral-400"></i>
                    </div>
                    <p class="text-neutral-500 text-xs">기술 구성을 입력하여<br>특허 분석을 시작하세요</p>
                </div>
            </div>
        </aside>

        <!-- Main Area -->
        <main id="mainContent" class="flex-1 ml-0 lg:ml-72 transition-all duration-300" style="margin-left: 18rem; background-color: #FFF7F2;">
            <div class="h-screen flex flex-col" style="padding-top: 80px;">

                <!-- Welcome Screen -->
                <div class="flex-1 overflow-y-auto p-5" id="welcomeArea">
                    <div class="max-w-4xl mx-auto">

                        <!-- Welcome -->
                        <div id="welcomeMessage" class="text-center py-10">

                            <!-- 아이콘 + 제목 -->
                            <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl mb-4" style="background: rgba(255, 107, 53, 0.10);">
                                <i class="fas fa-file-alt text-2xl text-primary" id="titleIcon"></i>
                            </div>
                            <h1 class="text-xl font-bold text-black mb-2" id="analysisTitle">특허·실용신안 리스크 분석</h1>
                            <p class="text-neutral-500 text-sm mb-4" id="analysisDescription">
                                화장품 기술 구성을 입력하면 AI가 특허·실용신안 침해 리스크를 자동으로 분석합니다
                            </p>

                            <!-- 분석 프로세스 카드 -->
                            <div class="border rounded-xl p-4 mb-5 max-w-md mx-auto" style="background: linear-gradient(135deg, var(--primary-bg), rgba(255, 140, 90, 0.04)); border-color: var(--primary-border);">
                                <p class="text-xs font-bold text-black mb-3 flex items-center justify-center gap-1.5">
                                    <i class="fas fa-lightbulb text-primary"></i>
                                    분석 프로세스
                                </p>
                                <div class="flex flex-col gap-2.5 text-left" id="stepsGuide">
                                    <!-- JS로 동적 주입 -->
                                </div>
                            </div>

                            <!-- CTA 버튼 -->
                            <div class="flex justify-center gap-3" id="ctaButtons">
                                <!-- JS로 동적 주입 -->
                            </div>

                        </div>
                    </div>
                </div>

                <!-- Input Area (하단 고정) -->
                <div class="border-t border-neutral-200 bg-white p-6 shadow-sm">
                    <div class="max-w-4xl mx-auto">

                        <!-- 이미지 프리뷰 (파일이 있을 때만 표시) -->
                        <div id="imagePreviewArea" class="image-preview-area" style="display: none;">
                            <div id="imagePreviewList" class="image-preview-list"></div>
                        </div>

                        <!-- 입력 행 -->
                        <div class="flex items-center gap-3">
                            <!-- 첨부 버튼 래퍼 (특허에서 숨김) -->
                            <div id="attachWrap" style="display:none;">
                                <input
                                    type="file"
                                    id="imageFileInput"
                                    accept="image/png,image/jpg,image/jpeg,image/webp"
                                    multiple
                                    style="display: none;"
                                />
                                <button
                                    type="button"
                                    id="attachBtn"
                                    onclick="triggerFileInput()"
                                    class="attach-btn"
                                    title="이미지 첨부 (png, jpg, jpeg, webp)"
                                >
                                    <i class="fas fa-paperclip"></i>
                                </button>
                            </div>

                            <!-- 텍스트 입력 -->
                            <textarea
                                id="messageInput"
                                placeholder="화장품 기술 구성을 입력하세요 (예: 히알루론산·나이아신아마이드 함유 저자극 수분 앰플 조성물)..."
                                rows="1"
                                class="flex-1 px-5 py-3 border border-neutral-200 rounded-xl focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 text-sm resize-none"
                                style="max-height: 120px; min-height: 44px;"
                            ></textarea>

                            <!-- 전송 버튼 -->
                            <button
                                onclick="sendMessage()"
                                class="px-6 py-3 bg-primary hover:bg-primary/90 text-white rounded-xl font-bold text-sm transition-all shadow-md hover:shadow-lg flex items-center gap-2"
                            >
                                <i class="fas fa-paper-plane"></i>
                                분석 시작
                            </button>
                        </div>

                        <!-- 힌트 -->
                        <p id="attachHint" class="text-xs text-neutral-400 mt-2 text-center">
                            Shift + Enter로 줄바꿈 &middot; Enter로 전송
                        </p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="toast.js"></script>
    <script src="script.js"></script>
    <script>
        // Fill sample query
        function fillSampleQuery(query) {
            document.getElementById('messageInput').value = query;
            document.getElementById('messageInput').focus();
        }

        // ── 이미지 첨부 로직 ──────────────────────────────────────
        let fileIdCounter = 0;
        const attachedFiles = []; // [{ id, file }, ...]

        /** 숨겨진 file input을 열어 파일 선택 다이얼로그 표시 */
        function triggerFileInput() {
            document.getElementById('imageFileInput').click();
        }

        /** file input change 핸들러 */
        function handleFileInputChange(e) {
            const allowed = ['image/png', 'image/jpeg', 'image/webp'];
            Array.from(e.target.files).forEach(file => {
                if (!allowed.includes(file.type)) {
                    if (typeof Toast !== 'undefined')
                        Toast.warning(`${file.name}: png, jpg, jpeg, webp 형식만 지원합니다`);
                    return;
                }
                // 동일 파일 중복 방지 (이름 + 크기 비교)
                const dup = attachedFiles.some(
                    item => item.file.name === file.name && item.file.size === file.size
                );
                if (dup) return;
                addImagePreview(file);
            });
            e.target.value = ''; // 같은 파일 재선택 허용
        }

        /** 파일을 attachedFiles 배열에 추가하고 썸네일 렌더링 */
        function addImagePreview(file) {
            const id = ++fileIdCounter;
            attachedFiles.push({ id, file });

            const reader = new FileReader();
            reader.onload = function(evt) {
                const list = document.getElementById('imagePreviewList');
                const item = document.createElement('div');
                item.className = 'image-preview-item';
                item.dataset.fileId = id;
                item.innerHTML = `
                    <img src="${evt.target.result}" alt="${file.name}" title="${file.name}">
                    <button class="remove-btn" onclick="removeImage(${id})" title="삭제">
                        <i class="fas fa-times"></i>
                    </button>
                `;
                list.appendChild(item);
                updatePreviewArea();
            };
            reader.readAsDataURL(file);
        }

        /** 개별 이미지 제거 */
        function removeImage(id) {
            const idx = attachedFiles.findIndex(item => item.id === id);
            if (idx !== -1) attachedFiles.splice(idx, 1);
            const el = document.querySelector(`.image-preview-item[data-file-id="${id}"]`);
            if (el) el.remove();
            updatePreviewArea();
        }

        /** 프리뷰 영역 표시/숨김 및 클립 버튼 상태 동기화 */
        function updatePreviewArea() {
            const area = document.getElementById('imagePreviewArea');
            const btn  = document.getElementById('attachBtn');
            const hasFiles = attachedFiles.length > 0;
            area.style.display = hasFiles ? 'block' : 'none';
            btn.classList.toggle('has-files', hasFiles);
        }

        // ── 전송 ──────────────────────────────────────────────────

        /** 메시지 + 첨부 이미지를 FormData로 전송 */
        function sendMessage() {
            const input   = document.getElementById('messageInput');
            const message = input.value.trim();

            if (!message && attachedFiles.length === 0) {
                if (typeof Toast !== 'undefined')
                    Toast.warning('제품 설명을 입력하거나 이미지를 첨부해주세요');
                return;
            }

            // FormData 구성 (multipart/form-data)
            const formData = new FormData();
            if (message) formData.append('message', message);
            attachedFiles.forEach((item, i) => {
                formData.append(`image_${i}`, item.file, item.file.name);
            });

            if (typeof Toast !== 'undefined') Toast.info('분석을 시작합니다...');

            // 입력 초기화
            input.value = '';
            attachedFiles.length = 0;
            document.getElementById('imagePreviewList').innerHTML = '';
            updatePreviewArea();

            // TODO: fetch('/api/analysis/text', { method: 'POST', body: formData }) 연동
            setTimeout(() => {
                if (typeof Toast !== 'undefined') Toast.success('분석 완료!');
                window.location.href = 'results.html';
            }, 1500);
        }

        // Enter key support (textarea: Enter 전송, Shift+Enter 줄바꿈)
        document.getElementById('messageInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // textarea 자동 높이 조절
        document.getElementById('messageInput').addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 120) + 'px';
        });

        // 하위 호환용 alias
        function fillSampleQuery(query) { fillAndFocus(query); }

        // Session card rendering (색상 통일: primary 톤만 사용)
        function renderSessionCard(session) {
            const toneCls = {
                fto: '',
                design: 'tone-mid',
            }[session.type] || '';

            const typeIcon = {
                fto: 'fa-file-alt',
                design: 'fa-palette',
            }[session.type];

            const typeText = {
                fto: '특허·실용신안',
                design: '디자인',
            }[session.type];

            // 리스크 컬러는 의미 전달을 위해 유지 (안전/경고/위험)
            const riskColors = {
                safe: 'text-green-600',
                warning: 'text-yellow-600',
                danger: 'text-red-600'
            };

            const riskIcon = {
                safe: 'fa-check-circle',
                warning: 'fa-exclamation-triangle',
                danger: 'fa-times-circle'
            }[session.risk];

            return `
                <div class="session-card" onclick="loadSession('${session.id}')">
                    <div class="flex items-center justify-between mb-3">
                        <span class="type-badge ${toneCls}">
                            <i class="fas ${typeIcon} mr-1"></i>${typeText}
                        </span>
                        <span class="text-xs text-neutral-500">${session.date}</span>
                    </div>
                    <h4 class="text-sm font-semibold text-black mb-2.5 leading-snug" style="display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">
                        ${session.productName}
                    </h4>
                    <div class="flex items-center gap-2 text-xs">
                        <i class="fas ${riskIcon} ${riskColors[session.risk]}"></i>
                        <span class="${riskColors[session.risk]} font-semibold">${getRiskText(session.risk)}</span>
                    </div>
                </div>
            `;
        }

        function getRiskText(risk) {
            return { safe: '안전', warning: '검토 필요', danger: '위험' }[risk] || '분석 중';
        }

        function loadSession(sessionId) {
            if (typeof Toast !== 'undefined') {
                Toast.info('세션을 불러오는 중...');
                setTimeout(() => Toast.success('세션 로드 완료!'), 500);
            }
        }

        // Update session list
        function updateSessionList(sessions) {
            const container = document.getElementById('chatSessions');
            const statusEl  = document.getElementById('sessionStatus');

            document.getElementById('totalAnalysisCount').textContent = sessions.length;

            if (sessions.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-8">
                        <div class="w-14 h-14 bg-neutral-50 rounded-2xl flex items-center justify-center mx-auto mb-3 border border-neutral-200">
                            <i class="fas fa-file-alt text-xl text-neutral-400"></i>
                        </div>
                        <p class="text-neutral-500 text-xs">기술 구성을 입력하여<br>특허 분석을 시작하세요</p>
                    </div>
                `;
            } else {
                container.innerHTML = sessions.map(renderSessionCard).join('');
            }

            if (statusEl) statusEl.textContent = sessions.length > 0 ? '완료' : '대기';
        }

        // 새 분석 시작
        function startNewAnalysis() {
            document.getElementById('messageInput').value = '';
            document.getElementById('messageInput').style.height = 'auto';
            document.getElementById('messageInput').focus();
            if (typeof Toast !== 'undefined') Toast.success('새 분석을 시작합니다.');
        }

        // Refresh sessions
        function refreshSessions() {
            if (typeof Toast !== 'undefined') Toast.info('새로고침 중...');
            setTimeout(() => {
                loadMockSessions();
                if (typeof Toast !== 'undefined') Toast.success('새로고침 완료!');
            }, 500);
        }

        // Load mock sessions
        function loadMockSessions() {
            const mockSessions = [
                {
                    id: 'session-001',
                    type: 'fto',
                    productName: '세라마이드·판테놀 기반 피부장벽 강화 크림 특허 분석',
                    risk: 'safe',
                    date: '오늘',
                    timestamp: new Date()
                },
                {
                    id: 'session-002',
                    type: 'design',
                    productName: '쿠션 팩트 케이스 타원형 슬림 디자인 유사도 검증',
                    risk: 'warning',
                    date: '어제',
                    timestamp: new Date(Date.now() - 86400000)
                },
                {
                    id: 'session-003',
                    type: 'fto',
                    productName: '무기자차 자외선 차단 선크림 조성물 특허 침해 분석',
                    risk: 'safe',
                    date: '2일 전',
                    timestamp: new Date(Date.now() - 172800000)

        // Sidebar toggle
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const mainContent = document.getElementById('mainContent');
            const toggleIcon = document.getElementById('toggleIcon');
            const openBtn = document.getElementById('sidebarOpenBtn');

            sidebar.classList.toggle('sidebar-hidden');

            if (sidebar.classList.contains('sidebar-hidden')) {
                mainContent.style.marginLeft = '0';
                toggleIcon.classList.remove('fa-chevron-left');
                toggleIcon.classList.add('fa-chevron-right');
                openBtn.classList.add('visible');
            } else {
                mainContent.style.marginLeft = '18rem';
                toggleIcon.classList.remove('fa-chevron-right');
                toggleIcon.classList.add('fa-chevron-left');
                openBtn.classList.remove('visible');
            }
        }

        // URL 파라미터 처리
        function updateTitleByType() {
            const urlParams = new URLSearchParams(window.location.search);
            const type = urlParams.get('type');

            const titleEl       = document.getElementById('analysisTitle');
            const descEl        = document.getElementById('analysisDescription');
            const iconEl        = document.getElementById('titleIcon');
            const stepsEl       = document.getElementById('stepsGuide');
            const ctaEl         = document.getElementById('ctaButtons');
            const placeholderEl = document.getElementById('messageInput');
            const attachWrapEl  = document.getElementById('attachWrap');
            const attachBtnEl   = document.getElementById('attachBtn');
            const attachHintEl  = document.getElementById('attachHint');
            const fileInputEl   = document.getElementById('imageFileInput');
            const patentBtn     = null;
            const designBtn     = null;

            const inactiveStyle = 'bg-transparent text-neutral-600 hover:text-black';
            const activeStyle   = 'bg-white text-primary shadow-sm';

            if (type === 'patent') {
                // ── 특허·실용신안 ─────────────────────────────
                document.title = '특허·실용신안 분석 - FTOGuard';
                titleEl.textContent = '특허·실용신안 리스크 분석';
                descEl.innerHTML = '화장품 기술 구성을 입력하면 AI가 특허·실용신안 침해 리스크를<br>자동으로 분석합니다';
                iconEl.className = 'fas fa-file-alt text-2xl text-primary';

                if (patentBtn) patentBtn.className = `px-3 py-1.5 text-xs font-semibold rounded-md transition-all ${activeStyle}`;
                if (designBtn) designBtn.className = `px-3 py-1.5 text-xs font-semibold rounded-md transition-all ${inactiveStyle}`;

                // 첨부 버튼 숨김
                if (attachWrapEl) attachWrapEl.style.display = 'none';
                if (attachHintEl) attachHintEl.textContent = 'Shift + Enter로 줄바꿈 · Enter로 전송';

                stepsEl.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="step-num step-1"><span>1</span></div>
                        <span class="text-xs text-neutral-700">기술 구성 입력 → VectorDB 특허 검색</span>
                    </div>
                    <div class="flex items-center gap-3">
                        <div class="step-num step-2"><span>2</span></div>
                        <span class="text-xs text-neutral-700">AI 청구항 매핑 → All Elements Rule 분석</span>
                    </div>
                    <div class="flex items-center gap-3">
                        <div class="step-num step-3"><span>3</span></div>
                        <span class="text-xs text-neutral-700">침해 리스크 등급 확인 → 회피 방안 도출</span>
                    </div>
                `;

                ctaEl.innerHTML = `
                    <button onclick="fillAndFocus('세라마이드·판테놀 기반 피부장벽 강화 크림 조성물')"
                        class="px-5 py-2.5 bg-primary hover:bg-primary/90 text-white rounded-full font-semibold text-sm transition-all shadow-md hover:shadow-lg flex items-center gap-2">
                        <i class="fas fa-bolt"></i>
                        예시로 시작하기
                    </button>
                    <button onclick="document.getElementById('messageInput').focus()"
                        class="px-5 py-2.5 bg-white border border-neutral-200 text-neutral-700 hover:border-primary hover:text-primary rounded-full font-semibold text-sm transition-all">
                        <i class="fas fa-pencil-alt mr-1"></i>
                        직접 입력하기
                    </button>
                `;

                placeholderEl.placeholder = '화장품 기술 구성을 입력하세요 (예: 히알루론산·나이아신아마이드 함유 저자극 수분 앰플 조성물)...';

            } else if (type === 'design') {
                // ── 디자인 ────────────────────────────────────
                document.title = '디자인 분석 - FTOGuard';
                titleEl.textContent = '디자인 리스크 분석';
                descEl.innerHTML = '화장품 용기·패키지 외관 이미지를 업로드하면<br>AI가 디자인권 침해 리스크를 자동으로 분석합니다';
                iconEl.className = 'fas fa-palette text-2xl text-primary';

                if (patentBtn) patentBtn.className = `px-3 py-1.5 text-xs font-semibold rounded-md transition-all ${inactiveStyle}`;
                if (designBtn) designBtn.className = `px-3 py-1.5 text-xs font-semibold rounded-md transition-all ${activeStyle}`;

                if (attachWrapEl) attachWrapEl.style.display = '';
                if (attachBtnEl) {
                    attachBtnEl.title = '화장품 용기·패키지 이미지 첨부 (png, jpg, jpeg, webp)';
                    attachBtnEl.style.borderColor = 'var(--primary)';
                    attachBtnEl.style.color = 'var(--primary)';
                    attachBtnEl.style.background = 'var(--primary-bg)';
                }
                if (attachHintEl) attachHintEl.textContent = '📎 이미지를 첨부하면 훨씬 정확한 분석이 가능합니다 (강력 권장)';
                if (fileInputEl) fileInputEl.accept = 'image/png,image/jpg,image/jpeg,image/webp';

                stepsEl.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="step-num step-1"><span>1</span></div>
                        <span class="text-xs text-neutral-700">이미지 업로드 → CLIP 임베딩 생성</span>
                    </div>
                    <div class="flex items-center gap-3">
                        <div class="step-num step-2"><span>2</span></div>
                        <span class="text-xs text-neutral-700">ChromaDB 검색 → 유사 디자인 TOP-10 추출</span>
                    </div>
                    <div class="flex items-center gap-3">
                        <div class="step-num step-3"><span>3</span></div>
                        <span class="text-xs text-neutral-700">디자인 선택 → 상세 비교 리포트 생성</span>
                    </div>
                `;

                ctaEl.innerHTML = `
                    <button onclick="document.getElementById('imageFileInput').click()"
                        class="px-5 py-2.5 bg-primary hover:bg-primary/90 text-white rounded-full font-semibold text-sm transition-all shadow-md hover:shadow-lg flex items-center gap-2">
                        <i class="fas fa-upload"></i>
                        이미지 업로드
                    </button>
                    <button onclick="fillAndFocus('원통형 에센스 병 - 무광 유리 재질, 골드 캡 적용')"
                        class="px-5 py-2.5 bg-white border border-neutral-200 text-neutral-700 hover:border-primary hover:text-primary rounded-full font-semibold text-sm transition-all">
                        <i class="fas fa-comment-dots mr-1"></i>
                        텍스트로 입력
                    </button>
                `;

                placeholderEl.placeholder = '화장품 용기·패키지 외관을 설명하세요 (예: 각진 사각형 토너 병, 투명 유리 재질, 블랙 펌프 헤드)...';
            }
        }

        function fillAndFocus(query) {
            const el = document.getElementById('messageInput');
            el.value = query;
            el.focus();
            el.setSelectionRange(el.value.length, el.value.length);
        }
        
        // 분석 유형 전환 함수
        function switchAnalysisType(type) {
            window.location.href = `analysis.html?type=${type}`;
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            updateTitleByType(); // URL 파라미터에 따라 제목 변경
            loadMockSessions();
            // 파일 input 이벤트 연결
            document.getElementById('imageFileInput').addEventListener('change', handleFileInputChange);
        });

        // 헤더는 script.js가 자동으로 로드 + updateAuthUI() 처리
        // (로그인 상태면 "로그아웃" 표시, 비로그인이면 "로그인" 표시)
    </script>
</body>
</html>
