<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- Toast System -->
    <link rel="stylesheet" href="toast.css">

    <title>AI 분석 - FTOGuard</title>

    <style>
        /* Pretendard 폰트 */
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css');

        * {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        :root {
            --primary: #FF6B35;
            --primary-dark: #E55A2B;
            --primary-light: #FF8C5A;
            --primary-bg: rgba(255, 107, 53, 0.06);
            --primary-bg-hover: rgba(255, 107, 53, 0.10);
            --primary-border: rgba(255, 107, 53, 0.18);
        }

        .text-primary { color: var(--primary); }
        .bg-primary { background-color: var(--primary); }
        .border-primary { border-color: var(--primary); }
        .hover\:bg-primary\/90:hover { background-color: rgba(255, 107, 53, 0.9); }

        /* 사이드바 애니메이션 */
        #sidebar {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #sidebar.sidebar-hidden {
            transform: translateX(-100%);
        }

        /* 사이드바 열기 버튼 (숨긴 상태에서만 표시) */
        #sidebarOpenBtn {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease 0.15s;
        }

        #sidebarOpenBtn.visible {
            opacity: 1;
            pointer-events: auto;
        }

        /* 통일 아이콘 버튼 스타일 */
        .icon-btn {
            width: 2rem;
            height: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #A3A3A3;
            border-radius: 0.5rem;
            transition: all 0.15s ease;
            background: transparent;
            border: none;
            cursor: pointer;
        }

        .icon-btn:hover {
            color: var(--primary);
            background: var(--primary-bg);
        }

        /* Session Card */
        .session-card {
            background: white;
            border: 1px solid #E5E5E5;
            border-radius: 1rem;
            padding: 1.25rem;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 0.75rem;
        }

        .session-card:hover {
            border-color: var(--primary);
            box-shadow: 0 4px 16px rgba(255, 107, 53, 0.08);
            transform: translateY(-2px);
        }

        .session-card.active {
            background: #FFF5F0;
            border-color: var(--primary);
            box-shadow: 0 4px 16px rgba(255, 107, 53, 0.12);
        }

        /* 스크롤바 */
        #chatSessions::-webkit-scrollbar {
            width: 6px;
        }

        #chatSessions::-webkit-scrollbar-track {
            background: transparent;
        }

        #chatSessions::-webkit-scrollbar-thumb {
            background: #D4D4D4;
            border-radius: 3px;
        }

        #chatSessions::-webkit-scrollbar-thumb:hover {
            background: var(--primary);
        }

        /* 세션 타입 뱃지 (primary 톤 통일) */
        .type-badge {
            font-size: 0.7rem;
            font-weight: 600;
            padding: 0.2rem 0.5rem;
            border-radius: 0.5rem;
            border: 1px solid var(--primary-border);
            background: var(--primary-bg);
            color: var(--primary);
            white-space: nowrap;
        }

        .type-badge.tone-mid {
            background: rgba(255, 107, 53, 0.10);
            border-color: rgba(255, 107, 53, 0.25);
            color: var(--primary-dark);
        }

        .type-badge.tone-deep {
            background: rgba(255, 107, 53, 0.15);
            border-color: rgba(255, 107, 53, 0.30);
            color: #CC4A1A;
        }

        /* 피처 카드 아이콘 - primary 톤 통일 (컴팩트 수평형) */
        .feature-icon-sm {
            width: 2.25rem;
            height: 2.25rem;
            border-radius: 0.625rem;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .feature-icon-sm.tone-light {
            background: rgba(255, 107, 53, 0.08);
            border: 1px solid rgba(255, 107, 53, 0.15);
        }

        .feature-icon-sm.tone-mid {
            background: rgba(255, 107, 53, 0.12);
            border: 1px solid rgba(255, 107, 53, 0.22);
        }

        .feature-icon-sm.tone-deep {
            background: rgba(255, 107, 53, 0.16);
            border: 1px solid rgba(255, 107, 53, 0.28);
        }

        .feature-icon-sm i {
            color: var(--primary);
            font-size: 0.875rem;
        }

        /* 스텝 넘버링 - primary 톤 그라데이션 */
        .step-num {
            width: 1.5rem;
            height: 1.5rem;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 1px 3px rgba(255, 107, 53, 0.15);
        }

        .step-num span {
            color: white;
            font-size: 0.65rem;
            font-weight: 700;
        }

        .step-num.step-1 { background: var(--primary); }
        .step-num.step-2 { background: var(--primary-light); }
        .step-num.step-3 { background: var(--primary-dark); }

        /* 빠른시작 버튼 */
        .sample-btn {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            width: 100%;
            padding: 0.5rem 0.75rem;
            background: white;
            border: 1px solid #E5E5E5;
            border-radius: 0.625rem;
            color: #525252;
            font-size: 0.75rem;
            font-weight: 600;
            text-align: left;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .sample-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: var(--primary-bg);
        }

        .sample-btn i {
            width: 12px;
            text-align: center;
            color: #A3A3A3;
            flex-shrink: 0;
        }

        .sample-btn:hover i {
            color: var(--primary);
        }

        /* ── 첨부 기능 ────────────────────────────────────────── */

        /* 입력 행 레이아웃 */
        .input-row {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        /* 클립(첨부) 버튼 */
        .attach-btn {
            width: 2.75rem;
            height: 2.75rem;
            flex-shrink: 0;
            display: flex !important;
            align-items: center;
            justify-content: center;
            border: 1px solid #D4D4D4;
            border-radius: 0.75rem;
            background: white;
            color: #737373;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .attach-btn:hover {
            color: var(--primary);
            border-color: var(--primary);
            background: var(--primary-bg);
        }

        .attach-btn.has-files {
            color: var(--primary);
            background: var(--primary-bg);
            border-color: var(--primary);
        }

        /* 이미지 프리뷰 영역 */
        .image-preview-area {
            margin-bottom: 0.625rem;
            padding: 0.625rem 0.75rem;
            background: var(--primary-bg);
            border: 1px solid var(--primary-border);
            border-radius: 0.75rem;
        }

        .image-preview-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        /* 개별 썸네일 */
        .image-preview-item {
            position: relative;
            width: 3.5rem;
            height: 3.5rem;
            border-radius: 0.5rem;
            overflow: visible;
            border: 1px solid var(--primary-border);
            flex-shrink: 0;
        }

        .image-preview-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 0.5rem;
            display: block;
        }

        /* 삭제(×) 버튼 */
        .image-preview-item .remove-btn {
            position: absolute;
            top: -0.35rem;
            right: -0.35rem;
            width: 1.25rem;
            height: 1.25rem;
            background: var(--primary);
            color: white;
            border: 2px solid white;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.55rem;
            padding: 0;
            line-height: 1;
            transition: background 0.15s ease;
            z-index: 1;
        }

        .image-preview-item .remove-btn:hover {
            background: var(--primary-dark);
        }
    </style>
</head>

<body style="background-color: #FFF7F2;">

    <!-- 개발 환경 인증 우회: script.js 로드 전에 가짜 토큰 주입 -->
    <script>
        (function() {
            // 만료 시간이 매우 긴 가짜 JWT 생성 (개발용)
            const header  = btoa(JSON.stringify({ alg: 'HS256', typ: 'JWT' }));
            const payload = btoa(JSON.stringify({ sub: 'dev', exp: Math.floor(Date.now() / 1000) + 86400 * 365 }));
            const devToken = `${header}.${payload}.dev_signature`;
            const devUser  = JSON.stringify({ id: 'dev', name: '개발자', email: 'dev@ftoguard.com' });

            if (!localStorage.getItem('authToken')) {
                localStorage.setItem('authToken', devToken);
                localStorage.setItem('user', devUser);
            }
        })();
    </script>
    <script src="toast.js"></script>
    <script src="script.js"></script>
    <script>
        // Fill sample query
        function fillSampleQuery(query) {
            document.getElementById('messageInput').value = query;
            document.getElementById('messageInput').focus();
        }

        // ── 이미지 첨부 로직 ──────────────────────────────────────
        let fileIdCounter = 0;
        const attachedFiles = []; // [{ id, file }, ...]

        /** 숨겨진 file input을 열어 파일 선택 다이얼로그 표시 */
        function triggerFileInput() {
            document.getElementById('imageFileInput').click();
        }

        /** file input change 핸들러 */
        function handleFileInputChange(e) {
            const allowed = ['image/png', 'image/jpeg', 'image/webp'];
            Array.from(e.target.files).forEach(file => {
                if (!allowed.includes(file.type)) {
                    if (typeof Toast !== 'undefined')
                        Toast.warning(`${file.name}: png, jpg, jpeg, webp 형식만 지원합니다`);
                    return;
                }
                // 동일 파일 중복 방지 (이름 + 크기 비교)
                const dup = attachedFiles.some(
                    item => item.file.name === file.name && item.file.size === file.size
                );
                if (dup) return;
                addImagePreview(file);
            });
            e.target.value = ''; // 같은 파일 재선택 허용
        }

        /** 파일을 attachedFiles 배열에 추가하고 썸네일 렌더링 */
        function addImagePreview(file) {
            const id = ++fileIdCounter;
            attachedFiles.push({ id, file });

            const reader = new FileReader();
            reader.onload = function(evt) {
                const list = document.getElementById('imagePreviewList');
                const item = document.createElement('div');
                item.className = 'image-preview-item';
                item.dataset.fileId = id;
                item.innerHTML = `
                    <img src="${evt.target.result}" alt="${file.name}" title="${file.name}">
                    <button class="remove-btn" onclick="removeImage(${id})" title="삭제">
                        <i class="fas fa-times"></i>
                    </button>
                `;
                list.appendChild(item);
                updatePreviewArea();
            };
            reader.readAsDataURL(file);
        }

        /** 개별 이미지 제거 */
        function removeImage(id) {
            const idx = attachedFiles.findIndex(item => item.id === id);
            if (idx !== -1) attachedFiles.splice(idx, 1);
            const el = document.querySelector(`.image-preview-item[data-file-id="${id}"]`);
            if (el) el.remove();
            updatePreviewArea();
        }

        /** 프리뷰 영역 표시/숨김 및 클립 버튼 상태 동기화 */
        function updatePreviewArea() {
            const area = document.getElementById('imagePreviewArea');
            const btn  = document.getElementById('attachBtn');
            const hasFiles = attachedFiles.length > 0;
            area.style.display = hasFiles ? 'block' : 'none';
            btn.classList.toggle('has-files', hasFiles);
        }

        // ── 전송 ──────────────────────────────────────────────────

        /** 메시지 + 첨부 이미지를 FormData로 전송 */
        function sendMessage() {
            const input   = document.getElementById('messageInput');
            const message = input.value.trim();

            if (!message && attachedFiles.length === 0) {
                if (typeof Toast !== 'undefined')
                    Toast.warning('제품 설명을 입력하거나 이미지를 첨부해주세요');
                return;
            }

            // FormData 구성 (multipart/form-data)
            const formData = new FormData();
            if (message) formData.append('message', message);
            attachedFiles.forEach((item, i) => {
                formData.append(`image_${i}`, item.file, item.file.name);
            });

            if (typeof Toast !== 'undefined') Toast.info('분석을 시작합니다...');

            // 입력 초기화
            input.value = '';
            attachedFiles.length = 0;
            document.getElementById('imagePreviewList').innerHTML = '';
            updatePreviewArea();

            // TODO: fetch('/api/analysis/text', { method: 'POST', body: formData }) 연동
            setTimeout(() => {
                if (typeof Toast !== 'undefined') Toast.success('분석 완료!');
                window.location.href = 'results.html';
            }, 1500);
        }

        // Enter key support
        document.getElementById('messageInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // Session card rendering (색상 통일: primary 톤만 사용)
        function renderSessionCard(session) {
            const toneCls = {
                fto: '',
                design: 'tone-mid',
            }[session.type] || '';

            const typeIcon = {
                fto: 'fa-file-alt',
                design: 'fa-palette',
            }[session.type];

            const typeText = {
                fto: '특허·실용신안',
                design: '디자인',
            }[session.type];

            // 리스크 컬러는 의미 전달을 위해 유지 (안전/경고/위험)
            const riskColors = {
                safe: 'text-green-600',
                warning: 'text-yellow-600',
                danger: 'text-red-600'
            };

            const riskIcon = {
                safe: 'fa-check-circle',
                warning: 'fa-exclamation-triangle',
                danger: 'fa-times-circle'
            }[session.risk];

            return `
                <div class="session-card" onclick="loadSession('${session.id}')">
                    <div class="flex items-center justify-between mb-3">
                        <span class="type-badge ${toneCls}">
                            <i class="fas ${typeIcon} mr-1"></i>${typeText}
                        </span>
                        <span class="text-xs text-neutral-500">${session.date}</span>
                    </div>
                    <h4 class="text-sm font-semibold text-black mb-2.5 leading-snug" style="display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">
                        ${session.productName}
                    </h4>
                    <div class="flex items-center gap-2 text-xs">
                        <i class="fas ${riskIcon} ${riskColors[session.risk]}"></i>
                        <span class="${riskColors[session.risk]} font-semibold">${getRiskText(session.risk)}</span>
                    </div>
                </div>
            `;
        }

        function getRiskText(risk) {
            return { safe: '안전', warning: '검토 필요', danger: '위험' }[risk] || '분석 중';
        }

        function loadSession(sessionId) {
            if (typeof Toast !== 'undefined') {
                Toast.info('세션을 불러오는 중...');
                setTimeout(() => Toast.success('세션 로드 완료!'), 500);
            }
        }

        // Update session list
        function updateSessionList(sessions) {
            const container = document.getElementById('chatSessions');
            const emptyState = document.getElementById('emptyState');

            if (sessions.length === 0) {
                container.innerHTML = '';
                emptyState.style.display = 'flex';
            } else {
                emptyState.style.display = 'none';
                container.innerHTML = sessions.map(renderSessionCard).join('');
            }

            document.getElementById('totalAnalysisCount').textContent = sessions.length;
            const today = new Date().toDateString();
            const todayCount = sessions.filter(s => new Date(s.timestamp).toDateString() === today).length;
            document.getElementById('todayAnalysisCount').textContent = todayCount;
        }

            const sidebar = document.getElementById('sidebar');
            const mainContent = document.getElementById('mainContent');
            const toggleIcon = document.getElementById('toggleIcon');
            const openBtn = document.getElementById('sidebarOpenBtn');

            sidebar.classList.toggle('sidebar-hidden');

            if (sidebar.classList.contains('sidebar-hidden')) {
                mainContent.style.marginLeft = '0';
                toggleIcon.classList.remove('fa-chevron-left');
                toggleIcon.classList.add('fa-chevron-right');
                openBtn.classList.add('visible');
            } else {
                mainContent.style.marginLeft = '18rem';
                toggleIcon.classList.remove('fa-chevron-right');
                toggleIcon.classList.add('fa-chevron-left');
                openBtn.classList.remove('visible');
