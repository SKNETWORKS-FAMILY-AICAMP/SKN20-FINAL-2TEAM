<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="toast.css">
    
    <title>분석 이력 - FTOGuard Admin</title>
    
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css');
        
        * {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        
        :root { --primary: #FF6B35; }
        .text-primary { color: var(--primary); }
        .bg-primary { background-color: var(--primary); }
        .hover\:bg-primary\/90:hover { background-color: rgba(255, 107, 53, 0.9); }
        
        .nav-item { transition: all 0.2s ease; }
        .nav-item:hover { background: #FFF5F0; color: var(--primary); }
        .nav-item.active { background: #FFF5F0; color: var(--primary); border-left: 3px solid var(--primary); }
    </style>
</head>

<body class="bg-neutral-50">

    <div class="flex h-screen overflow-hidden">
        
        <!-- Sidebar -->
        <aside class="w-64 bg-white border-r border-neutral-200 flex flex-col fixed left-0 top-0 bottom-0 z-40">
            <div class="p-6 border-b border-neutral-200">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-primary rounded-xl flex items-center justify-center">
                        <i class="fas fa-shield-alt text-white"></i>
                    </div>
                    <div>
                        <h1 class="text-lg font-bold text-black">FTOGuard</h1>
                        <p class="text-xs text-neutral-500">Admin Panel</p>
                    </div>
                </div>
            </div>
            
            <nav class="flex-1 overflow-y-auto p-4">
                <div class="space-y-1">
                    <a href="admin-dashboard.html" class="nav-item flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-semibold text-neutral-700">
                        <i class="fas fa-chart-line w-5"></i>대시보드
                    </a>
                    <a href="admin-users.html" class="nav-item flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-semibold text-neutral-700">
                        <i class="fas fa-users w-5"></i>사용자 관리
                    </a>
                    <a href="admin-analyses.html" class="nav-item active flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-semibold">
                        <i class="fas fa-file-alt w-5"></i>분석 이력
                    </a>
                    <a href="admin-patents.html" class="nav-item flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-semibold text-neutral-700">
                        <i class="fas fa-database w-5"></i>특허 DB
                    </a>
                    <a href="admin-settings.html" class="nav-item flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-semibold text-neutral-700">
                        <i class="fas fa-cog w-5"></i>시스템 설정
                    </a>
                </div>
            </nav>
            
            <div class="p-4 border-t border-neutral-200">
                <div class="flex items-center gap-3 px-4 py-3 bg-neutral-50 rounded-lg">
                    <div class="w-10 h-10 bg-primary rounded-full flex items-center justify-center">
                        <span class="text-white font-bold text-sm">AD</span>
                    </div>
                    <div class="flex-1">
                        <p class="text-sm font-semibold text-black">관리자</p>
                        <p class="text-xs text-neutral-500">admin@ftoguard.com</p>
                    </div>
                    <button onclick="logout()" class="text-neutral-400 hover:text-primary transition-colors">
                        <i class="fas fa-sign-out-alt"></i>
                    </button>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 ml-64 overflow-y-auto">
            
            <header class="bg-white border-b border-neutral-200 sticky top-0 z-30">
                <div class="px-8 py-6">
                    <div class="flex items-center justify-between">
                        <div>
                            <h2 class="text-2xl font-bold text-black">분석 이력</h2>
                            <p class="text-sm text-neutral-600 mt-1">전체 FTO 분석 기록 조회 및 관리</p>
                        </div>
                        <div class="flex gap-3">
                            <button class="px-4 py-2 bg-white border border-neutral-200 rounded-lg text-sm font-semibold text-neutral-700 hover:border-primary hover:text-primary transition-all">
                                <i class="fas fa-file-export mr-2"></i>CSV 내보내기
                            </button>
                            <button class="px-4 py-2 bg-primary text-white rounded-lg text-sm font-bold hover:bg-primary/90 transition-all shadow-md">
                                <i class="fas fa-download mr-2"></i>리포트 생성
                            </button>
                        </div>
                    </div>
                </div>
            </header>

            <div class="p-8">
                
                <!-- Stats -->
                <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
                    <div class="bg-white border border-neutral-200 rounded-xl p-5">
                        <p class="text-sm text-neutral-600 mb-1">전체 분석</p>
                        <p class="text-2xl font-bold text-black">8,934</p>
                        <p class="text-xs text-green-600 font-semibold mt-1">↗ 8.2% (지난주)</p>
                    </div>
                    <div class="bg-white border border-neutral-200 rounded-xl p-5">
                        <p class="text-sm text-neutral-600 mb-1">FTO 분석</p>
                        <p class="text-2xl font-bold text-primary">4,200</p>
                        <p class="text-xs text-neutral-500 mt-1">47.0%</p>
                    </div>
                    <div class="bg-white border border-neutral-200 rounded-xl p-5">
                        <p class="text-sm text-neutral-600 mb-1">디자인 분석</p>
                        <p class="text-2xl font-bold text-purple-600">2,800</p>
                        <p class="text-xs text-neutral-500 mt-1">31.3%</p>
                    </div>
                    <div class="bg-white border border-neutral-200 rounded-xl p-5">
                        <p class="text-sm text-neutral-600 mb-1">멀티모달</p>
                        <p class="text-2xl font-bold text-blue-600">1,934</p>
                        <p class="text-xs text-neutral-500 mt-1">21.7%</p>
                    </div>
                </div>

                <!-- Filter & Search -->
                <div class="bg-white border border-neutral-200 rounded-xl p-6 mb-6">
                    <div class="grid grid-cols-1 md:grid-cols-5 gap-4">
                        <div class="relative">
                            <input type="text" placeholder="분석 ID 또는 제품명 검색..." class="w-full px-4 py-2 border border-neutral-200 rounded-lg text-sm focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20">
                            <i class="fas fa-search absolute right-3 top-1/2 transform -translate-y-1/2 text-neutral-400"></i>
                        </div>
                        <select class="px-4 py-2 border border-neutral-200 rounded-lg text-sm focus:outline-none focus:border-primary">
                            <option>모든 유형</option>
                            <option>FTO 분석</option>
                            <option>디자인 유사도</option>
                            <option>멀티모달</option>
                        </select>
                        <select class="px-4 py-2 border border-neutral-200 rounded-lg text-sm focus:outline-none focus:border-primary">
                            <option>모든 위험도</option>
                            <option>안전</option>
                            <option>주의</option>
                            <option>위험</option>
                        </select>
                        <input type="date" class="px-4 py-2 border border-neutral-200 rounded-lg text-sm focus:outline-none focus:border-primary">
                        <button class="px-4 py-2 bg-neutral-100 hover:bg-neutral-200 text-neutral-700 rounded-lg text-sm font-semibold transition-all">
                            <i class="fas fa-filter mr-2"></i>필터 초기화
                        </button>
                    </div>
                </div>

                <!-- Analyses Table -->
                <div class="bg-white border border-neutral-200 rounded-xl overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full">
                            <thead class="bg-neutral-50 border-b border-neutral-200">
                                <tr>
                                    <th class="text-left py-4 px-6 text-xs font-bold text-neutral-600 uppercase">
                                        <input type="checkbox" class="rounded border-neutral-300">
                                    </th>
                                    <th class="text-left py-4 px-6 text-xs font-bold text-neutral-600 uppercase">분석 ID</th>
                                    <th class="text-left py-4 px-6 text-xs font-bold text-neutral-600 uppercase">사용자</th>
                                    <th class="text-left py-4 px-6 text-xs font-bold text-neutral-600 uppercase">제품명</th>
                                    <th class="text-left py-4 px-6 text-xs font-bold text-neutral-600 uppercase">유형</th>
                                    <th class="text-left py-4 px-6 text-xs font-bold text-neutral-600 uppercase">검색 특허</th>
                                    <th class="text-left py-4 px-6 text-xs font-bold text-neutral-600 uppercase">위험도</th>
                                    <th class="text-left py-4 px-6 text-xs font-bold text-neutral-600 uppercase">분석 시간</th>
                                    <th class="text-right py-4 px-6 text-xs font-bold text-neutral-600 uppercase">관리</th>
                                </tr>
                            </thead>
                            <tbody id="analysesTable">
                                <!-- Rows will be inserted by JavaScript -->
                            </tbody>
                        </table>
                    </div>
                    
                    <!-- Pagination -->
                    <div class="border-t border-neutral-200 px-6 py-4 flex items-center justify-between">
                        <p class="text-sm text-neutral-600">1-20 / 8,934건 표시 중</p>
                        <div class="flex gap-2">
                            <button class="px-3 py-1 border border-neutral-200 rounded-lg text-sm font-semibold text-neutral-400 cursor-not-allowed">이전</button>
                            <button class="px-3 py-1 bg-primary text-white rounded-lg text-sm font-semibold">1</button>
                            <button class="px-3 py-1 border border-neutral-200 hover:border-primary rounded-lg text-sm font-semibold text-neutral-700">2</button>
                            <button class="px-3 py-1 border border-neutral-200 hover:border-primary rounded-lg text-sm font-semibold text-neutral-700">3</button>
                            <span class="px-3 py-1 text-sm text-neutral-400">...</span>
                            <button class="px-3 py-1 border border-neutral-200 hover:border-primary rounded-lg text-sm font-semibold text-neutral-700">447</button>
                            <button class="px-3 py-1 border border-neutral-200 hover:border-primary rounded-lg text-sm font-semibold text-neutral-700">다음</button>
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script src="toast.js"></script>
    <script>
        function renderAnalyses() {
            const analyses = [
                { id: 'A-2024-0847', user: 'kim@example.com', product: '스마트 보온 머그컵', type: 'FTO', patents: 4247, risk: 'safe', time: '2024.02.10 14:32' },
                { id: 'A-2024-0846', user: 'lee@example.com', product: '무선 충전 패드', type: 'Design', patents: 3821, risk: 'warning', time: '2024.02.10 13:45' },
                { id: 'A-2024-0845', user: 'park@example.com', product: '접이식 스마트폰 케이스', type: 'Multi', patents: 5032, risk: 'safe', time: '2024.02.10 12:18' },
                { id: 'A-2024-0844', user: 'choi@example.com', product: '세라믹 히터', type: 'FTO', patents: 2967, risk: 'danger', time: '2024.02.10 11:52' },
                { id: 'A-2024-0843', user: 'jung@example.com', product: 'LED 조명 시스템', type: 'Design', patents: 4105, risk: 'safe', time: '2024.02.10 10:33' },
                { id: 'A-2024-0842', user: 'kang@example.com', product: '블루투스 이어폰', type: 'Multi', patents: 6234, risk: 'warning', time: '2024.02.10 09:21' },
                { id: 'A-2024-0841', user: 'yoon@example.com', product: '공기청정기 필터', type: 'FTO', patents: 3456, risk: 'safe', time: '2024.02.10 08:15' },
                { id: 'A-2024-0840', user: 'lim@example.com', product: '스마트 워치 밴드', type: 'Design', patents: 2789, risk: 'safe', time: '2024.02.09 17:42' },
                { id: 'A-2024-0839', user: 'han@example.com', product: '휴대용 가습기', type: 'FTO', patents: 3912, risk: 'warning', time: '2024.02.09 16:28' },
                { id: 'A-2024-0838', user: 'song@example.com', product: '전동 칫솔 헤드', type: 'Multi', patents: 4521, risk: 'safe', time: '2024.02.09 15:03' }
            ];
            
            const typeLabels = { FTO: 'FTO 분석', Design: '디자인', Multi: '멀티모달' };
            const typeColors = {
                FTO: 'bg-primary/10 text-primary border-primary/20',
                Design: 'bg-purple-50 text-purple-600 border-purple-200',
                Multi: 'bg-blue-50 text-blue-600 border-blue-200'
            };
            
            const riskLabels = { safe: '안전', warning: '주의', danger: '위험' };
            const riskColors = {
                safe: 'bg-green-50 text-green-600 border-green-200',
                warning: 'bg-yellow-50 text-yellow-600 border-yellow-200',
                danger: 'bg-red-50 text-red-600 border-red-200'
            };
            
            const tbody = document.getElementById('analysesTable');
            tbody.innerHTML = analyses.map(a => `
                <tr class="border-b border-neutral-100 hover:bg-neutral-50">
                    <td class="py-4 px-6">
                        <input type="checkbox" class="rounded border-neutral-300">
                    </td>
                    <td class="py-4 px-6">
                        <span class="text-sm font-mono font-semibold text-black">${a.id}</span>
                    </td>
                    <td class="py-4 px-6">
                        <span class="text-sm text-neutral-700">${a.user}</span>
                    </td>
                    <td class="py-4 px-6">
                        <span class="text-sm font-semibold text-black">${a.product}</span>
                    </td>
                    <td class="py-4 px-6">
                        <span class="inline-block px-2 py-1 rounded-md text-xs font-semibold border ${typeColors[a.type]}">
                            ${typeLabels[a.type]}
                        </span>
                    </td>
                    <td class="py-4 px-6">
                        <span class="text-sm font-semibold text-black">${a.patents.toLocaleString()}건</span>
                    </td>
                    <td class="py-4 px-6">
                        <span class="inline-block px-2 py-1 rounded-md text-xs font-semibold border ${riskColors[a.risk]}">
                            ${riskLabels[a.risk]}
                        </span>
                    </td>
                    <td class="py-4 px-6">
                        <span class="text-sm text-neutral-600">${a.time}</span>
                    </td>
                    <td class="py-4 px-6 text-right">
                        <button class="text-primary hover:text-primary/80 text-sm font-semibold mr-3">상세</button>
                        <button class="text-red-500 hover:text-red-600 text-sm font-semibold">삭제</button>
                    </td>
                </tr>
            `).join('');
        }
        
        function logout() {
            if (typeof Toast !== 'undefined') Toast.info('로그아웃 중...');
            setTimeout(() => window.location.href = 'index.html', 500);
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            renderAnalyses();
        });
    </script>
</body>
</html>
