version: '3.8'

services:
  # FastAPI 백엔드
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fto-backend
    environment:
      DATABASE_URL: mysql+pymysql://admin:rmdak2020@fto-db.c34w48m8sov6.ap-northeast-2.rds.amazonaws.com:3306/fto
      SECRET_KEY: your-secret-key-change-in-production
      HF_TOKEN: ${HF_TOKEN:-YOUR_HF_TOKEN_HERE}
    ports:
      - "8000:8000"
    restart: unless-stopped

  # 프론트엔드 (Nginx)
  frontend:
    build:
      context: ./FRONTEND
      dockerfile: Dockerfile
    container_name: fto-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
