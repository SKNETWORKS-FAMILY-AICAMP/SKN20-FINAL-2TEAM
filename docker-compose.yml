services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fto-backend
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@${MYSQL_HOST}:3306/${MYSQL_DATABASE}
      - MYSQL_HOST=${MYSQL_HOST}
      - MYSQL_PORT=3306
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - CHROMA_HOST=chromadb-patent
      - CHROMA_PORT=8000
      - CHROMA_IMAGE_HOST=chromadb-design
      - CHROMA_IMAGE_PORT=8000
      - RUNPOD_API_KEY=${RUNPOD_API_KEY}
      - RUNPOD_PATENT_ENDPOINT_ID=${RUNPOD_PATENT_ENDPOINT_ID}
      - RUNPOD_DESIGN_BASE_URL=${RUNPOD_DESIGN_BASE_URL}
      - DESIGN_VLLM_MODEL=${DESIGN_VLLM_MODEL}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - HF_TOKEN=${HF_TOKEN}
      - SECRET_KEY=${SECRET_KEY:-demo-secret-key-2026}
      - DEV_BYPASS_AUTH=true
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION:-ap-northeast-2}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-ftoguard-design-images}
    volumes:
      - ./data/bm25_index:/app/rag/index/bm25_index
    depends_on:
      - chromadb-patent
      - chromadb-design
    restart: always

  chromadb-patent:
    image: chromadb/chroma:latest
    container_name: chromadb-patent
    volumes:
      - ./data/chroma-patent:/data
    environment:
      - ANONYMIZED_TELEMETRY=false
    restart: always

  chromadb-design:
    image: chromadb/chroma:latest
    container_name: chromadb-design
    volumes:
      - ./data/chroma-design:/data
    environment:
      - ANONYMIZED_TELEMETRY=false
    restart: always
