<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>디자인 유사성 분석 챗봇</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f2f5;
      color: #333;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #1a1a2e;
      color: #fff;
      padding: 16px 32px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    header h1 { font-size: 1.2rem; font-weight: 600; }
    header span { font-size: 0.8rem; color: #aaa; }

    .tab-bar {
      display: flex;
      background: #16213e;
      padding: 0 32px;
    }
    .tab-bar button {
      padding: 12px 24px;
      border: none;
      background: transparent;
      color: #aaa;
      cursor: pointer;
      font-size: 0.9rem;
      border-bottom: 3px solid transparent;
      transition: all 0.2s;
    }
    .tab-bar button.active {
      color: #e94560;
      border-bottom-color: #e94560;
    }

    main {
      flex: 1;
      padding: 32px;
      max-width: 960px;
      width: 100%;
      margin: 0 auto;
    }

    .panel { display: none; }
    .panel.active { display: block; }

    /* 이미지 분석 패널 */
    .upload-box {
      border: 2px dashed #c0c0c0;
      border-radius: 12px;
      padding: 40px;
      text-align: center;
      background: #fff;
      cursor: pointer;
      transition: border-color 0.2s;
      margin-bottom: 16px;
    }
    .upload-box:hover { border-color: #e94560; }
    .upload-box input[type="file"] { display: none; }
    .upload-box .icon { font-size: 3rem; margin-bottom: 8px; }
    .upload-box p { color: #888; font-size: 0.9rem; }
    #preview-img {
      max-height: 200px;
      max-width: 100%;
      border-radius: 8px;
      margin-top: 12px;
    }

    .query-row {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    .query-row input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 0.9rem;
    }

    button.primary {
      padding: 10px 24px;
      background: #e94560;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      transition: background 0.2s;
    }
    button.primary:hover { background: #c73652; }
    button.primary:disabled { background: #ccc; cursor: not-allowed; }

    /* 유사 디자인 카드 그리드 */
    #similar-section { margin-top: 24px; }
    #similar-section h2 { font-size: 1rem; font-weight: 600; margin-bottom: 12px; }

    .input-analysis-box {
      background: #fff;
      border-left: 4px solid #e94560;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.85rem;
      color: #555;
      margin-bottom: 16px;
    }

    .design-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 12px;
    }
    .design-card {
      background: #fff;
      border-radius: 10px;
      padding: 12px;
      cursor: pointer;
      border: 2px solid transparent;
      transition: border-color 0.2s, box-shadow 0.2s;
      text-align: center;
    }
    .design-card:hover { border-color: #e94560; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .design-card.selected { border-color: #e94560; background: #fff5f7; }
    .design-card img {
      width: 100%;
      height: 120px;
      object-fit: contain;
      border-radius: 6px;
      background: #f7f7f7;
      margin-bottom: 8px;
    }
    .design-card .no-img {
      width: 100%;
      height: 120px;
      background: #f0f0f0;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      margin-bottom: 8px;
    }
    .design-card .app-num { font-size: 0.72rem; color: #888; }
    .design-card .article { font-size: 0.82rem; font-weight: 600; margin: 4px 0; }
    .design-card .badge {
      display: inline-block;
      font-size: 0.68rem;
      padding: 2px 6px;
      border-radius: 4px;
      background: #e8f4fd;
      color: #1a73e8;
    }
    .design-card .dist { font-size: 0.72rem; color: #aaa; margin-top: 4px; }

    #select-btn-row { margin-top: 16px; }

    /* 리포트 */
    #report-section { margin-top: 24px; }
    .report-box {
      background: #fff;
      border-radius: 10px;
      padding: 20px 24px;
      font-size: 0.88rem;
      line-height: 1.7;
      white-space: pre-wrap;
      border: 1px solid #eee;
    }
    .report-box + .report-box { margin-top: 12px; }
    .report-box h3 { font-size: 0.95rem; margin-bottom: 10px; color: #e94560; }

    /* 텍스트 챗봇 패널 */
    .chat-container {
      background: #fff;
      border-radius: 12px;
      border: 1px solid #eee;
      display: flex;
      flex-direction: column;
      height: 520px;
    }
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.88rem;
      line-height: 1.6;
      white-space: pre-wrap;
    }
    .msg.user { background: #e94560; color: #fff; align-self: flex-end; border-radius: 12px 12px 2px 12px; }
    .msg.bot { background: #f0f2f5; color: #333; align-self: flex-start; border-radius: 12px 12px 12px 2px; }

    .chat-input-row {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      border-top: 1px solid #eee;
    }
    .chat-input-row input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 0.9rem;
    }

    /* 로딩 */
    .spinner {
      display: inline-block;
      width: 18px; height: 18px;
      border: 3px solid #fff;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error-msg { color: #e94560; font-size: 0.85rem; margin-top: 8px; }

    /* 헬스 배지 */
    #health-badge {
      font-size: 0.75rem;
      padding: 3px 10px;
      border-radius: 20px;
      background: #2d2d2d;
      margin-left: auto;
    }
    #health-badge.ok { background: #1e7e34; color: #fff; }
    #health-badge.err { background: #c0392b; color: #fff; }
  </style>
</head>
<body>

<header>
  <div>🎨</div>
  <div>
    <h1>디자인 유사성 분석 챗봇</h1>
    <span>Design FTO Analysis</span>
  </div>
  <div id="health-badge">서버 확인 중...</div>
</header>

<div class="tab-bar">
  <button class="active" onclick="switchTab('image')">이미지 분석</button>
  <button onclick="switchTab('text')">텍스트 질문</button>
</div>

<main>

  <!-- ===== 이미지 분석 패널 ===== -->
  <div id="panel-image" class="panel active">

    <div class="upload-box" id="drop-zone" onclick="document.getElementById('file-input').click()">
      <div class="icon">📂</div>
      <p>클릭하거나 파일을 드래그해서 이미지를 업로드하세요</p>
      <p style="font-size:0.78rem; margin-top:4px;">(JPG, PNG, WEBP)</p>
      <img id="preview-img" style="display:none;" />
      <input type="file" id="file-input" accept="image/*" onchange="handleFile(this.files[0])" />
    </div>

    <div class="query-row">
      <input type="text" id="img-query" placeholder="분석 질문 (기본: 이 제품과 유사한 디자인을 분석해줘)" />
      <button class="primary" id="analyze-btn" onclick="analyzeImage()">분석 시작</button>
    </div>
    <div id="img-error" class="error-msg"></div>

    <!-- 유사 디자인 결과 -->
    <div id="similar-section" style="display:none;">
      <h2>유사 디자인 검색 결과 <span style="font-weight:400; color:#888; font-size:0.85rem;">(카드 선택 후 상세 비교)</span></h2>
      <div id="input-analysis" class="input-analysis-box"></div>
      <div class="design-grid" id="design-grid"></div>
      <div id="select-btn-row">
        <button class="primary" id="select-btn" onclick="selectDesign()" disabled>선택한 디자인 상세 비교</button>
      </div>
      <div id="select-error" class="error-msg"></div>
    </div>

    <!-- 리포트 결과 -->
    <div id="report-section" style="display:none;">
      <div class="report-box">
        <h3>📊 상세 비교</h3>
        <div id="detailed-comparison"></div>
      </div>
      <div class="report-box" style="margin-top:12px;">
        <h3>📋 최종 리포트</h3>
        <div id="final-report"></div>
      </div>
    </div>

  </div>

  <!-- ===== 텍스트 질문 패널 ===== -->
  <div id="panel-text" class="panel">
    <div class="chat-container">
      <div class="chat-messages" id="chat-messages">
        <div class="msg bot">안녕하세요! 디자인 관련 질문을 자유롭게 입력해주세요. 웹 검색과 DB 검색을 통해 답변해 드립니다.</div>
      </div>
      <div class="chat-input-row">
        <input type="text" id="text-input" placeholder="질문을 입력하세요..." onkeydown="if(event.key==='Enter') sendText()" />
        <button class="primary" id="send-btn" onclick="sendText()">전송</button>
      </div>
    </div>
  </div>

</main>

<script>
  const API = 'http://localhost:8000';
  let threadId = null;
  let selectedIndex = null;

  // ── 탭 전환 ────────────────────────────────────────
  function switchTab(name) {
    document.querySelectorAll('.tab-bar button').forEach((b, i) => {
      b.classList.toggle('active', (i === 0 && name === 'image') || (i === 1 && name === 'text'));
    });
    document.getElementById('panel-image').classList.toggle('active', name === 'image');
    document.getElementById('panel-text').classList.toggle('active', name === 'text');
  }

  // ── 서버 상태 확인 ──────────────────────────────────
  async function checkHealth() {
    const badge = document.getElementById('health-badge');
    try {
      const res = await fetch(`${API}/health`);
      const data = await res.json();
      badge.textContent = '● 서버 연결됨';
      badge.className = 'ok';
    } catch {
      badge.textContent = '● 서버 오프라인';
      badge.className = 'err';
    }
  }
  checkHealth();
  setInterval(checkHealth, 30000);

  // ── 이미지 파일 처리 ────────────────────────────────
  function handleFile(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      const img = document.getElementById('preview-img');
      img.src = e.target.result;
      img.style.display = 'block';
    };
    reader.readAsDataURL(file);
  }

  // 드래그 앤 드롭
  const dropZone = document.getElementById('drop-zone');
  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.style.borderColor = '#e94560'; });
  dropZone.addEventListener('dragleave', () => { dropZone.style.borderColor = '#c0c0c0'; });
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.style.borderColor = '#c0c0c0';
    const file = e.dataTransfer.files[0];
    if (file) { handleFile(file); document.getElementById('file-input').files = e.dataTransfer.files; }
  });

  // ── 1단계: 이미지 분석 ──────────────────────────────
  async function analyzeImage() {
    const fileInput = document.getElementById('file-input');
    const errEl = document.getElementById('img-error');
    errEl.textContent = '';

    if (!fileInput.files[0]) { errEl.textContent = '이미지를 먼저 업로드해주세요.'; return; }

    const btn = document.getElementById('analyze-btn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>분석 중...';

    // 이전 결과 초기화
    document.getElementById('similar-section').style.display = 'none';
    document.getElementById('report-section').style.display = 'none';
    threadId = null; selectedIndex = null;

    try {
      const form = new FormData();
      form.append('image', fileInput.files[0]);
      form.append('user_query', document.getElementById('img-query').value || '이 제품과 유사한 디자인을 분석해줘');

      const res = await fetch(`${API}/chat/image`, { method: 'POST', body: form });
      const data = await res.json();
      if (!res.ok || !data.success) throw new Error(data.detail || '분석 실패');

      threadId = data.thread_id;
      renderSimilarDesigns(data);
    } catch (e) {
      errEl.textContent = '오류: ' + e.message;
    } finally {
      btn.disabled = false;
      btn.textContent = '분석 시작';
    }
  }

  // ── 유사 디자인 카드 렌더링 ──────────────────────────
  function renderSimilarDesigns(data) {
    document.getElementById('input-analysis').textContent = data.input_analysis || '';
    const grid = document.getElementById('design-grid');
    grid.innerHTML = '';
    selectedIndex = null;
    document.getElementById('select-btn').disabled = true;

    (data.similar_designs || []).forEach(d => {
      const card = document.createElement('div');
      card.className = 'design-card';
      card.dataset.index = d.index;

      let imgHtml = d.image_base64
        ? `<img src="data:image/jpeg;base64,${d.image_base64}" alt="디자인 이미지" />`
        : `<div class="no-img">🖼️</div>`;

      card.innerHTML = `
        ${imgHtml}
        <div class="app-num">${d.application_number}</div>
        <div class="article">${d.article_name}</div>
        <span class="badge">${d.admst_stat}</span>
        <div class="dist">유사도 거리: ${Number(d.distance).toFixed(4)}</div>
      `;

      card.addEventListener('click', () => {
        document.querySelectorAll('.design-card').forEach(c => c.classList.remove('selected'));
        card.classList.add('selected');
        selectedIndex = d.index;
        document.getElementById('select-btn').disabled = false;
      });

      grid.appendChild(card);
    });

    document.getElementById('similar-section').style.display = 'block';
  }

  // ── 2단계: 선택 → 상세 비교 ─────────────────────────
  async function selectDesign() {
    const errEl = document.getElementById('select-error');
    errEl.textContent = '';
    if (!threadId || selectedIndex === null) return;

    const btn = document.getElementById('select-btn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>비교 중...';

    try {
      const form = new FormData();
      form.append('thread_id', threadId);
      form.append('selected_index', selectedIndex);

      const res = await fetch(`${API}/chat/select`, { method: 'POST', body: form });
      const data = await res.json();
      if (!res.ok || !data.success) throw new Error(data.detail || '비교 실패');

      document.getElementById('detailed-comparison').textContent = data.detailed_comparison || '';
      document.getElementById('final-report').textContent = data.final_report || '';
      document.getElementById('report-section').style.display = 'block';
      document.getElementById('report-section').scrollIntoView({ behavior: 'smooth' });
    } catch (e) {
      errEl.textContent = '오류: ' + e.message;
    } finally {
      btn.disabled = false;
      btn.textContent = '선택한 디자인 상세 비교';
    }
  }

  // ── 텍스트 챗봇 ─────────────────────────────────────
  async function sendText() {
    const input = document.getElementById('text-input');
    const query = input.value.trim();
    if (!query) return;

    appendMsg('user', query);
    input.value = '';

    const btn = document.getElementById('send-btn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>';

    const thinking = appendMsg('bot', '답변 생성 중...');

    try {
      const form = new FormData();
      form.append('text_query', query);

      const res = await fetch(`${API}/chat/text`, { method: 'POST', body: form });
      const data = await res.json();
      if (!res.ok || !data.success) throw new Error(data.detail || '답변 실패');

      thinking.textContent = data.answer || '(답변 없음)';
    } catch (e) {
      thinking.textContent = '오류: ' + e.message;
    } finally {
      btn.disabled = false;
      btn.textContent = '전송';
    }
  }

  function appendMsg(role, text) {
    const container = document.getElementById('chat-messages');
    const div = document.createElement('div');
    div.className = `msg ${role}`;
    div.textContent = text;
    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
    return div;
  }
</script>

</body>
</html>
